  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);

}

      ${s.intake_at ? `<details class="more"><summary>Full spec</summary><div class="kv">
        ${s.product_name ? `<b>Product</b><span>${esc(s.product_name)} <span class="mut">· ${esc(s.category || '')}</span></span>` : ''}
        ${s.materials ? `<b>Materials</b><span>${list(s.materials)}</span>` : ''}${s.dimensions ? `<b>Dimensions</b><span>${soft(s.dimensions)}${s.weight ? ' · ' + soft(s.weight) : ''}</span>` : ''}

          <select data-negst="${g.id}" class="btn sm" style="width:auto">${['open', 'waiting_factory', 'waiting_us', 'sample', 'agreed', 'dropped'].map(x => `<option value="${x}" ${x === g.status ? 'selected' : ''}>${x.replace('_', ' ')}</option>`).join('')}</select>

          <div style="margin-top:6px">Your counter${g.terms.last_reply.counter_cny ? ` (aim for <b>${cny(g.terms.last_reply.counter_cny)}</b>)` : ''}:</div><pre>${esc(g.terms.last_reply.counter_zh || '')}</pre>
          <details class="sm"><summary>English</summary><div style="margin-top:4px">${esc(g.terms.last_reply.counter_en || '')}</div></details>
          <div class="bar" style="margin-top:8px"><button class="btn sm primary" data-cp="${esc(g.terms.last_reply.counter_zh || '')}">Copy Chinese</button><button class="btn sm" data-sent="${g.id}">I sent it</button></div></div>` : ''}
        <div class="bar" style="margin-top:10px"><button class="btn sm" data-paste="${g.id}">Paste factory reply</button><span class="sm mut">Paste their WeChat or 1688 message, or a screenshot. Lathe reads the price and terms and drafts your answer.</span></div>
        <div class="rbox" data-rbox="${g.id}"><textarea data-rtext="${g.id}" rows="4" placeholder="Paste what the factory sent… (you can also paste a screenshot here)"></textarea>
          <div class="bar" style="margin-top:8px"><label class="btn sm" style="margin:0">Add screenshot<input type="file" accept="image/*" data-rfile="${g.id}" hidden></label><span class="sm mut" data-rshot="${g.id}"></span><button class="btn sm primary" data-read="${g.id}">Read reply</button></div></div>
        <div id="rfq-${g.id}"></div></div>`).join('') : `<div class="empty">No negotiations yet. On the Find factories step, press Negotiate on the factories you like.</div>`}

  </div>
  <div>
    <div class="panel" data-tab="quote"><h2>4 · Quote <span class="mut sm">landed cost &amp; margin</span></h2>
      ${rate ? `<p class="sm mut">Rate card: <b>${esc(rate.name)}</b> (${dt(rate.effective_date)}) · <a href="#/rates">edit rates</a></p>` : `<p class="sm mut">No rate card. <a href="#/rates">Create one</a>.</p>`}
      <div class="grid2"><div><label>Factory price (¥/unit)</label><input id="qPrice" type="number" step="0.01" value="${quotes[0]?.inputs?.factory_price_cny ?? s.estimated_factory_price_cny ?? ''}"></div><div><label>Quantity</label><input id="qQty" type="number" value="${r.quantity || 1000}"></div>
        <div><label>Domestic freight to port (¥ total)</label><input id="qDom" type="number" step="1" value="${quotes[0]?.inputs?.domestic_freight_cny ?? 0}"></div><div><label>Intl freight (USD total)</label><input id="qIntl" type="number" step="1" value="${quotes[0]?.inputs?.intl_freight_usd ?? 0}"></div>
        <div><label>Mode</label><select id="qMode"><option value="ocean">Ocean</option><option value="air">Air</option></select></div><div><label>Client price (USD/unit)</label><input id="qClient" type="number" step="0.01" value="${r.client_unit_price ?? r.target_unit_price ?? ''}"></div>
        <div><label>Commission %</label><input id="qComm" type="number" step="0.1" value="${rate?.rates?.commission_pct ?? 6}"></div><div><label>Factory for this quote</label><select id="qFac"><option value="">—</option>${D.factories.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div></div>
      <div class="bar" style="margin-top:12px"><button class="btn primary" id="calc">Calculate</button><button class="btn" id="saveQuote" disabled>Save quote</button></div>
      <div id="calcOut"></div>
      ${quotes.length ? `<h3>Saved quotes</h3>${quotes.map(qt => `<div class="card"><div class="bar" style="justify-content:space-between"><div><b>${usd(qt.landed_unit_cost, 2)} landed</b> → ${usd(qt.client_unit_price)} <span class="mut">· margin ${fmt(qt.margin_pct, 1)}%</span><div class="sm mut">${esc(qt.factories?.name || '')} · ${dt(qt.created_at)} · ${esc(qt.status)}${qt.released_to_client ? ' · <span class="badge b-pass">released</span>' : ''}</div></div><div class="bar"><button class="btn sm" data-qrel="${qt.id}" data-on="${qt.released_to_client ? 0 : 1}">${qt.released_to_client ? 'Hide from client' : 'Release to client'}</button><button class="btn sm" data-order="${qt.id}" data-fac="${qt.factory_id || ''}" data-qty="${qt.inputs?.qty || r.quantity || ''}" data-price="${qt.inputs?.factory_price_cny || ''}" data-cp="${qt.client_unit_price || ''}">Create order</button></div></div></div>`).join('')}` : ''}

    <div class="panel" data-tab="intake sourcing negotiating quote order"><h2>Activity <span class="mut sm">${acts.length}</span></h2>

    </div>
    <div class="panel" data-tab="intake sourcing"><h2>Client requirements &amp; notes <span class="mut sm">${reqs.length}</span></h2>
      ${reqs.length ? reqs.map(x => `<div class="card" style="padding:8px 12px"><span class="badge ${x.kind === 'defect_to_watch' ? 'b-fail' : x.kind === 'question' ? 'b-rev' : x.kind === 'approval' ? 'b-pass' : ''}">${esc(x.kind.replace('_', ' '))}</span> <span class="sm mut">${esc(x.author)} · ${dt(x.created_at)}</span><div>${esc(x.body)}</div></div>`).join('') : `<p class="sm mut">Nothing yet. Clients add these in their portal; they feed the QC standard.</p>`}
      <div class="bar" style="margin-top:10px"><select id="rqKind" class="btn sm" style="width:auto"><option value="requirement">requirement</option><option value="defect_to_watch">defect to watch</option><option value="question">question</option></select><input id="rqBody" placeholder="Add a note as the team" style="flex:1"><button class="btn sm" id="rqAdd">Add</button></div>
    </div>
    <div class="panel" data-tab="order"><h2>5 · Order</h2>
      ${orders.length ? orders.map(od => orderCard(od, r, OLINKS, OSESS)).join('') : `<p class="sm mut">No order yet. When the client approves a quote, press "Create order" on it (or on the next-step bar).</p>`}
    </div>

}

function viewFactories() {
  return `<div class="hello"><div><h1>Factories</h1><p>Every supplier the agents or you have found, with verification.</p></div><button class="btn primary" id="addFac">Add factory</button></div>
  <div class="panel wrap">${D.factories.length ? `<table><thead><tr><th>Factory</th><th>Source</th><th>City</th><th>Contact</th><th>Verified</th><th>Updated</th></tr></thead><tbody>
  ${D.factories.map(f => `<tr class="row" onclick="location.hash='#/factory/${f.id}'"><td><b>${esc(f.name)}</b>${f.name_zh ? `<div class="sm mut">${esc(f.name_zh)}</div>` : ''}</td><td>${esc(f.source)}</td><td>${esc(f.city || '—')}</td><td>${esc(f.contact_name || '')}${f.mobile ? `<div class="sm"><a href="${esc(telHref(f.mobile))}" onclick="event.stopPropagation()">${esc(f.mobile)}</a></div>` : f.phone ? `<div class="sm">${esc(f.phone)}</div>` : ''}${f.wechat ? `<div class="sm mut">WeChat ${esc(f.wechat)}</div>` : ''}${!f.mobile && !f.phone && !f.wechat && f.source === '1688' ? `<span class="sm mut">${f.contact_status === 'none' ? 'none listed' : f.contact_status === 'error' ? 'page didn’t load' : 'not fetched'}</span>` : ''}</td><td>${f.is_verified_factory === true ? '<span class="badge b-pass">factory</span>' : f.is_verified_factory === false ? '<span class="badge b-fail">trader</span>' : '<span class="badge">unchecked</span>'}</td><td>${dt(f.updated_at)}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">No factories yet. They appear here when you search 1688 from a request.</div>`}</div>`;
}

async function viewFactory(id) {
  const f = D.factories.find(x => x.id === id); if (!f) return '<p>Not found.</p>';
  const [{ data: cands }, { data: fnegs }] = await Promise.all([sb.from('request_candidates').select('id, request_id, listing_title, price_cny, moq, match_score, sourcing_requests(title)').eq('factory_id', id),
    sb.from('negotiations').select('request_id, status, current_offer_cny, agreed_cny, moq, lead_time_days, updated_at, sourcing_requests(title)').eq('factory_id', id).order('updated_at', { ascending: false })]);
  const v = f.verification || {};
  return `<div class="hello"><div><a class="sm" href="#/factories">← Factories</a><h1>${esc(f.name)}</h1><p>${esc(f.city || '')} ${f.source_url ? `· <a href="${esc(f.source_url)}" target="_blank">${esc(f.source)} page ↗</a>` : '· ' + esc(f.source)}</p></div></div>
  <div class="cols"><div class="panel"><h2>Details</h2>
    <div class="grid2"><div><label>Name</label><input id="fName" value="${esc(f.name)}"></div><div><label>Chinese name (for registry lookup)</label><input id="fZh" value="${esc(f.name_zh || '')}"></div>
    <div><label>City</label><input id="fCity" value="${esc(f.city || '')}"></div><div><label>Province</label><input id="fProv" value="${esc(f.province || '')}"></div>
    <div><label>Contact</label><input id="fContact" value="${esc(f.contact_name || '')}"></div><div><label>WeChat</label><input id="fWechat" value="${esc(f.wechat || '')}"></div>
    <div><label>Mobile</label><input id="fMobile" value="${esc(f.mobile || '')}"></div><div><label>Phone (landline)</label><input id="fPhone" value="${esc(f.phone || '')}"></div>
    <div><label>Email</label><input id="fEmail" value="${esc(f.email || '')}"></div><div><label>Website</label><input id="fWeb" value="${esc(f.website || '')}"></div>
    <div><label>Fax</label><input id="fFax" value="${esc(f.fax || '')}"></div><div><label>Address</label><input id="fAddr" value="${esc(f.address || '')}"></div></div>
    ${contactBits(f, true) ? `<div class="cbox">${contactBits(f, true)}</div>` : ''}
    ${`<p class="sm mut" style="margin-top:8px">${f.verification?.registry?.checked_at ? (f.verification.registry.matched ? `Contacts from the company registry (天眼查) ${dt(f.verification.registry.checked_at)}${f.verification.registry.legal_person ? ' · legal rep ' + esc(f.verification.registry.legal_person) : ''}. ` : `Not found in the company registry under “${esc(f.verification.registry.keyword || '')}”. Set the Chinese name above and look up again. `) : ''}<button class="link" style="background:none;border:0;padding:0;color:var(--harbor);cursor:pointer;font-weight:600" data-getc="${f.id}" data-force="1">${f.verification?.registry?.checked_at ? 'Look up again' : 'Look up in company registry'}</button></p>`}
    <label>Notes</label><textarea id="fNotes">${esc(f.notes || '')}</textarea>
    <div class="bar" style="margin-top:12px"><button class="btn primary" id="fSave">Save</button></div>

      <b>Business scope</b><span><input id="vScope" value="${esc(v.business_scope || '')}" placeholder="经营范围 (from 企查查)"></span><b>Registered capital</b><span><input id="vCap" value="${esc(v.registered_capital || '')}" placeholder="注册资本"></span><b>Insured staff</b><span><input id="vStaff" type="number" value="${esc(v.insured_staff ?? '')}" placeholder="参保人数"></span><b>US shipments</b><span><input id="vCustoms" type="number" value="${esc(f.customs_shipments ?? '')}" placeholder="ImportYeti count"></span></div>
    <div class="bar" style="margin-top:10px"><button class="btn" id="vSave">Save verification</button><button class="btn" id="vRun">Run checks</button></div><div id="vOut"></div>

}

function calcRows(c) {
  const row = (l, v, b) => `<tr><td>${l}</td><td class="right">${b ? '<b>' + v + '</b>' : v}</td></tr>`;
  return `<div class="wrap" style="margin-top:12px"><table><tbody>
    ${row('Goods (ex-works)', usd(c.goods_usd))}${row('Domestic freight', usd(c.domestic_freight_usd))}${c.vat_rebate_usd ? row('VAT rebate', '−' + usd(c.vat_rebate_usd)) : ''}${row('FOB value', usd(c.fob_usd), true)}
    ${row('International freight', usd(c.intl_freight_usd))}${row(`Duties &amp; tariffs (${fmt(c.duty_pct_total, 2)}%)`, usd(c.duty_usd))}${row('MPF', usd(c.mpf_usd))}${row('HMF', usd(c.hmf_usd))}${row('Broker', usd(c.broker_fee_usd))}${row('Insurance', usd(c.insurance_usd))}${row('Payment fees', usd(c.payment_fee_usd))}
    ${row('Landed total', usd(c.landed_total_usd), true)}${row('Landed per unit', usd(c.landed_unit_usd, 4), true)}
    ${c.client_unit_price != null ? row(`Our commission (${fmt(c.commission_pct, 1)}%)`, usd(c.commission_usd)) + row('Client price per unit', usd(c.client_unit_price)) + row('Client profit per unit', usd(c.profit_unit_usd, 4), true) + row('Client margin', `<span class="num" style="font-size:30px;color:${c.margin_pct < 0 ? 'var(--fail)' : c.margin_pct < 15 ? 'var(--review)' : 'var(--pass)'}">${fmt(c.margin_pct, 1)}%</span>`) : ''}
  </tbody></table></div>`;
}

async function render() {
  const h = location.hash || '#/requests'; const [, page, id] = h.split('/');
  document.querySelectorAll('.rail a[data-nav]').forEach(a => { const on = a.dataset.nav === page || (page === 'request' && a.dataset.nav === 'requests') || (page === 'factory' && a.dataset.nav === 'factories') || (page === 'new' && a.dataset.nav === 'requests'); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  app.innerHTML = page === 'account' ? await viewAccount() : page === 'join' ? await viewJoin(id) : page === 'new' ? viewNew() : page === 'request' ? await viewRequest(id) : page === 'factories' ? viewFactories() : page === 'factory' ? await viewFactory(id) : page === 'clients' ? viewClients() : page === 'rates' ? viewRates() : viewRequests();
  wire(page, id);
}
const refresh = async () => { await load(); await render(); };

function wire(page, id) {
  const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn));
  if (!page || page === 'requests') {
    on('[data-lf]', 'click', (e) => { LIST_FILTER = e.currentTarget.dataset.lf; render(); });
    const ps = [...new Set([...document.querySelectorAll('[data-rqimg]')].map(x => x.dataset.rqimg))];
    if (ps.length) sb.storage.from('photos').createSignedUrls(ps, 3600).then(({ data }) => (data || []).forEach((d, i) => { if (d.signedUrl) document.querySelectorAll(`[data-rqimg="${CSS.escape(ps[i])}"]`).forEach(el => { el.style.backgroundImage = `url("${d.signedUrl}")`; }); }));
  }
  const copy = (txt) => navigator.clipboard.writeText(txt).then(() => true, () => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; });
  on('[data-cp]', 'click', async (e) => { e.stopPropagation(); if (await copy(e.currentTarget.dataset.cp)) toast('Copied'); });
  on('[data-wx]', 'click', async (e) => { e.stopPropagation(); await copy(e.currentTarget.dataset.wx); toast('Number copied. In WeChat tap ＋ → Add Contacts, paste it and search.'); });
  on('[data-getc]', 'click', (e) => { e.stopPropagation(); const b = e.currentTarget; fetchContacts({ factory_ids: [b.dataset.getc], force: b.dataset.force === '1' }).catch(err => { CONTACTS.running = false; toast(err.message); render(); }); });
  on('[data-delreq]', 'click', async (e) => { e.preventDefault(); e.stopPropagation(); if (await deleteRequest(e.currentTarget.dataset.delreq)) render(); });
  if ($('delReq')) $('delReq').onclick = async () => { if (await deleteRequest(id)) location.hash = '#/requests'; };
  const upd = async (t, patch, eq) => { const { error } = await sb.from(t).update(patch).eq('id', eq); if (error) toast(error.message); else await refresh(); };
  if (page === 'account' || page === 'join') hideGoogleIfOff();
  if (Object.values(D.flow || {}).some(f => f.next_key === 'working')) { clearTimeout(window.__jobPoll); window.__jobPoll = setTimeout(liveRefresh, 8000); }
  if (page === 'account') {
    const authErr = (err) => toast(/not authorized/i.test(err.message) ? 'Lathe can\u2019t email that address yet (email sending isn\u2019t set up). Use a password instead.' : err.message);
    const creds = () => ({ email: ($('aEmail')?.value || '').trim(), password: $('aPass')?.value || '' });
    if ($('aSave')) $('aSave').onclick = async (e) => {
      const { email, password } = creds(); if (!email || password.length < 8) return toast('Enter an email and a password of at least 8 characters');
      busy(e.target, true);
      const { data, error } = await sb.auth.updateUser({ email }, { emailRedirectTo: SITE });
      if (error) { busy(e.target, false); return authErr(error); }
      if (data.user?.email) { const r2 = await sb.auth.updateUser({ password }); if (r2.error) { busy(e.target, false); return toast(r2.error.message); } toast('Account created. You can now sign in anywhere with this email.'); return render(); }
      afterLogin('sourcing.html#/account'); busy(e.target, false); toast('Check your email and click the confirmation link, then set your password here.');
    };
    if ($('aIn')) $('aIn').onclick = async (e) => {
      const { email, password } = creds(); if (!email || !password) return toast('Enter your email and password');
      busy(e.target, true); const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { busy(e.target, false); return toast(error.message === 'Invalid login credentials' ? 'Wrong email or password' : error.message); }
      useWorkspace(null); location.hash = '#/requests'; location.reload();
    };
    if ($('aLink')) $('aLink').onclick = async () => {
      const email = ($('aEmail').value || '').trim(); if (!email) return toast('Enter your email first');
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: SITE } }); if (error) return authErr(error);
      afterLogin('sourcing.html#/requests'); toast('Check your email for a sign-in link.');
    };
    if ($('aGoogle')) $('aGoogle').onclick = async () => { afterLogin('sourcing.html#/requests'); const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: SITE, queryParams: { prompt: 'select_account' } } }); if (error) toast(/not enabled|Unsupported provider/i.test(error.message) ? 'Google sign-in isn\u2019t switched on yet.' : error.message); };
    if ($('aPw')) $('aPw').onclick = () => { $('pwRow').style.display = 'flex'; $('newPw').focus(); };
    if ($('pwSave')) $('pwSave').onclick = async () => { const p = $('newPw').value; if (p.length < 8) return toast('At least 8 characters'); const { error } = await sb.auth.updateUser({ password: p }); if (error) return toast(error.message); toast('Password saved'); $('pwRow').style.display = 'none'; };
    if ($('aOut')) $('aOut').onclick = async () => { if (!await confirmBox({ title: 'Sign out?', body: 'Your work stays saved. Sign in again with your email to get back to it.', confirmLabel: 'Sign out' })) return; await sb.auth.signOut(); useWorkspace(null); location.replace('login.html'); };
    if ($('wsRename')) $('wsRename').onclick = async () => { const name = $('wsName').value.trim(); if (!name) return; const { error } = await sb.from('workspaces').update({ name }).eq('id', ws); if (error) return toast(error.message); $('sync').textContent = name; toast('Renamed'); };
    on('[data-wsw]', 'click', (e) => { useWorkspace(e.currentTarget.dataset.wsw); location.hash = '#/requests'; location.reload(); });
    on('[data-rmm]', 'click', async (e) => { const b = e.currentTarget; if (!await confirmBox({ title: 'Remove from workspace?', body: `<b>${esc(b.dataset.em)}</b> will lose access to this workspace. Their past work stays.`, confirmLabel: 'Remove' })) return; const { error } = await sb.from('workspace_members').delete().eq('workspace_id', ws).eq('user_id', b.dataset.rmm); if (error) return toast(error.message); toast('Removed'); render(); });
    if ($('invGo')) $('invGo').onclick = async (e) => {
      const email = $('invEmail').value.trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('Enter their email');
      busy(e.target, true); const { data, error } = await sb.from('workspace_invites').insert({ workspace_id: ws, email, role: $('invRole').value }).select('token').single();
      if (error) { busy(e.target, false); return toast(error.message); }
      try { await navigator.clipboard.writeText(joinUrl(data.token)); toast('Invite link copied. Send it to them on WeChat or email.'); } catch (err) { toast('Invite created. Use "Copy invite link" below.'); }
      render();
    };
    on('[data-rminv]', 'click', async (e) => { const { error } = await sb.from('workspace_invites').delete().eq('id', e.currentTarget.dataset.rminv); if (error) return toast(error.message); render(); });
  }
  if (page === 'join') {
    const joinNow = async (t) => { const { data, error } = await sb.rpc('accept_invite', { p_token: t }); if (error) return toast(error.message); useWorkspace(data); toast('You\u2019re in'); location.hash = '#/requests'; location.reload(); };
    const authErr = (err) => toast(/not authorized/i.test(err.message) ? 'Lathe can\u2019t send email to that address yet. Ask the person who invited you to finish email setup, or use a password.' : err.message);
    if ($('jJoin')) $('jJoin').onclick = (e) => joinNow(e.currentTarget.dataset.t);
    if ($('jOut')) $('jOut').onclick = async () => { await sb.auth.signOut(); useWorkspace(null); location.reload(); };
    if ($('jGoogle')) $('jGoogle').onclick = async (e) => { afterLogin('sourcing.html#/join/' + e.currentTarget.dataset.t); const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: SITE, queryParams: { prompt: 'select_account' } } }); if (error) toast(/not enabled|Unsupported provider/i.test(error.message) ? 'Google sign-in isn\u2019t switched on yet.' : error.message); };
    if ($('jUp')) $('jUp').onclick = async (e) => {
      const t = e.currentTarget.dataset.t, email = $('jEmail').value, password = $('jPass').value; if (password.length < 8) return toast('Choose a password of at least 8 characters');
      busy(e.target, true); const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: SITE } });
      if (error) { busy(e.target, false); return authErr(error); }
      if (data.session) return joinNow(t);
      afterLogin('sourcing.html#/join/' + t); busy(e.target, false); toast('Check your email and click the confirmation link to finish joining.');
    };
    if ($('jIn')) $('jIn').onclick = async (e) => {
      const t = e.currentTarget.dataset.t, email = $('jEmail').value, password = $('jPass').value; if (!password) return toast('Enter your password');
      busy(e.target, true); const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { busy(e.target, false); return toast(error.message === 'Invalid login credentials' ? 'Wrong password. Try "email me a sign-in link".' : error.message); }
      joinNow(t);
    };
    if ($('jLink')) $('jLink').onclick = async (e) => { const t = e.currentTarget.dataset.t; const { error } = await sb.auth.signInWithOtp({ email: $('jEmail').value, options: { emailRedirectTo: SITE } }); if (error) return authErr(error); afterLogin('sourcing.html#/join/' + t); toast('Check your email for a sign-in link, open it on this device, then press Join.'); };
  }
  if (page === 'new') {
    const drop = $('drop'), input = $('nFiles');
    drop.onclick = (e) => { if (!e.target.closest('[data-rmf]')) input.click(); };
    input.onchange = (e) => { addNewFiles(e.target.files); e.target.value = ''; };
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); addNewFiles(e.dataTransfer.files); };
    drawNewFiles();
    ['nTitle', 'nSpec', 'nBrief', 'nQty', 'nTarget', 'nDead'].forEach(k => $(k).addEventListener('input', () => { NEW_FORM[k] = $(k).value; }));
    $('nClient').onchange = async (e) => {
      if (e.target.value !== '__new') { NEW_FORM.nClient = e.target.value; return; }
      const c = await clientDialog();
      if (c) NEW_FORM.nClient = c.id;
      $('nClient').innerHTML = clientOptions(NEW_FORM.nClient);
    };
    $('nSave').onclick = async (e) => {
      const specTxt = $('nSpec').value.trim(), notes = $('nBrief').value.trim(), userTitle = $('nTitle').value.trim();
      if (!specTxt && !notes && !NEW_FILES.length) return toast('Add a photo or write the spec');
      const status = (t) => { $('nStatus').textContent = t; };
      busy(e.target, true); status('Creating…');
      const brief = [specTxt && 'SPEC (written by us):\n' + specTxt, notes && 'CLIENT NOTES:\n' + notes].filter(Boolean).join('\n\n');
      const { data, error } = await sb.from('sourcing_requests').insert({ workspace_id: ws, client_id: ($('nClient').value && $('nClient').value !== '__new') ? $('nClient').value : null, title: userTitle || 'Untitled request', raw_brief: brief, quantity: +$('nQty').value || null, target_unit_price: +$('nTarget').value || null, deadline: $('nDead').value || null }).select('id').single();
      if (error) { busy(e.target, false); status(''); return toast(error.message); }
      const paths = [];
      try {
        for (let k = 0; k < NEW_FILES.length; k++) {
          status(`Uploading photo ${k + 1} of ${NEW_FILES.length}…`);
          const path = `${ws}/sourcing/${data.id}/${crypto.randomUUID()}.jpg`;
          const up = await sb.storage.from('photos').upload(path, NEW_FILES[k].blob, { contentType: 'image/jpeg' });
          if (up.error) throw up.error; paths.push(path);
        }
        if (paths.length) await sb.from('sourcing_requests').update({ spec: { photos: paths } }).eq('id', data.id);
      } catch (err) { toast('Photo upload failed: ' + (err.message || err)); }
      try { status(paths.length ? 'Reading the spec and photos…' : 'Reading the spec…'); await call('intake', { request_id: data.id, set_title: !userTitle }); }
      catch (err) { toast('Saved. Intake failed: ' + err.message); }
      if (paths.length && $('nPhotoSearch').checked) {
        try { status('Starting the photo search…'); await call('start_job', { request_id: data.id, kind: 'search_photo', args: { paths: paths.slice(0, 3), filters: QF } }); toast('Searching 1688 with your photos in the background. Results appear on the request.'); VIEW_TAB[data.id] = 'sourcing'; }
        catch (err) { toast('Intake done. Photo search: ' + err.message); }
      }
      NEW_FILES.forEach(f => URL.revokeObjectURL(f.url)); NEW_FILES = []; NEW_FORM = {};
      await load(); location.hash = '#/request/' + data.id;
    };
  }
  if (page === 'request') {
    const r = D.requests.find(x => x.id === id);
    $('stSel').onchange = (e) => { delete VIEW_TAB[id]; upd('sourcing_requests', { status: e.target.value }, id); };
    const setTab = (t, scroll) => { VIEW_TAB[id] = t; $('tabbed').dataset.show = t; document.querySelectorAll('[data-phase]').forEach(x => x.classList.toggle('view', x.dataset.phase === t)); if (scroll) $('tabbed').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    on('[data-phase]', 'click', (e) => setTab(e.currentTarget.dataset.phase));
    on('[data-goto]', 'click', async (e) => { const t = e.currentTarget.dataset.goto; setTab(t, true); if (t === 'sourcing' && r.status === 'intake' && r.spec?.intake_at) await sb.from('sourcing_requests').update({ status: 'sourcing' }).eq('id', id); });
    const nextAct = async (act, arg, btn) => {
      if (act === 'tab') return setTab(arg, true);
      if (act === 'edit') { setTab('intake'); $('specEdit').style.display = 'block'; return $('specEdit').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      if (act === 'intake') { setTab('intake'); delete VIEW_TAB[id]; return $('runIntake').click(); }
      if (act === 'search') { setTab('sourcing'); return $('search1688').click(); }
      if (act === 'photosearch') { setTab('sourcing'); return photoSearch(id, { paths: (r.spec?.photos || []).slice(-3) }, btn); }

      await upd('cost_assumptions', { rates, effective_date: eff }, aid); toast('Rates saved'); });
  }
}

// ---------- boot ----------
(async () => {
  if (!CFG.supabaseUrl || !window.supabase) { app.innerHTML = '<p>Setup needed: add your Supabase URL and anon key to config.js.</p>'; return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  let { data: { session } } = await sb.auth.getSession();
  if (!session || session.user.is_anonymous) { const jm = (location.hash || '').match(/^#\/join\/([0-9a-f]+)/); location.replace('login.html' + (jm ? '?join=' + jm[1] : '?next=' + encodeURIComponent('sourcing.html' + location.hash))); return; }
  if (/^#\/login/.test(location.hash)) location.hash = '#/requests';
  ME = session.user;
  const { data: m } = await sb.from('workspace_members').select('workspace_id, workspaces(name)').eq('user_id', session.user.id).order('created_at');
  if (!m || !m.length) { app.innerHTML = '<p>No workspace found for this account. Open the <a href="./">home page</a> once first.</p>'; return; }
  let pref = null; try { pref = localStorage.getItem('lathe-ws'); } catch (e) {}
  const curWs = m.find(x => x.workspace_id === pref) || m[0];
  ws = curWs.workspace_id; $('sync').textContent = (curWs.workspaces?.name || 'My workspace') + (session.user.is_anonymous ? ' · not signed in' : '');
  await load(); await render();
  window.addEventListener('hashchange', render);
  const ch = sb.channel('sourcing');
  ['sourcing_requests', 'request_candidates', 'negotiations', 'quotes', 'client_requirements', 'sourcing_orders', 'factories', 'clients', 'activity'].forEach(tb => ch.on('postgres_changes', { event: '*', schema: 'public', table: tb, filter: 'workspace_id=eq.' + ws }, liveRefresh));
  const seenJobs = new Set();
  ch.on('postgres_changes', { event: '*', schema: 'public', table: 'jobs', filter: 'workspace_id=eq.' + ws }, (p) => { const j = p.new; if (j && j.status !== 'running' && !seenJobs.has(j.id)) { seenJobs.add(j.id); jobToast(j); } liveRefresh(); });
  ch.subscribe();
})();
})();
</script>
</body></html>
