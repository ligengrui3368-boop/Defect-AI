<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home · Lathe</title>
<script>
// Factory links (?f=) and website demos (?demo=) open the product app directly. Sign-in links land here.
(function () { var s = location.search; if (/[?&](f|demo)=/.test(s)) location.replace('app.html' + s + location.hash); })();
</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F7F5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="theme.css?v=4">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;font-size:15px;line-height:1.5}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.rail a{display:flex;align-items:center;gap:10px;text-decoration:none}
.rail a svg{width:18px;height:18px;opacity:.7;flex-shrink:0}
.rail .grow{flex:1}
.rail .clients a{font-size:14.5px!important}
.rail .clients a i{width:8px;height:8px;border-radius:50%;background:var(--line2);margin:0 5px}
.rail .clients a b{margin-left:auto;font-weight:400;color:var(--muted);font-size:13px}
.hello{margin:0 0 22px}
.hello h2{margin:0;font-size:26px;font-weight:650;letter-spacing:-.025em}
.hello p{margin:4px 0 0;color:var(--muted);font-size:15px}
</style>
<script src="i18n.js?v=1"></script>
<script>/* Browsers keep pages for up to 10 minutes. If the server has a newer copy, reload once. */(function(){try{fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(function(r){var lm=r.headers.get('last-modified');if(!lm)return;var k='dc-fresh:'+location.pathname;if(new Date(lm).getTime()-new Date(document.lastModified).getTime()>1000&&sessionStorage.getItem(k)!==lm){sessionStorage.setItem(k,lm);location.reload();}}).catch(function(){});}catch(e){}})();</script>
</head><body>
<div class="dc-shell">
  <nav class="rail" aria-label="Main">
    <div class="brand"><i aria-hidden="true"></i>Lathe</div>
    <a href="./" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg>Home</a>
    <a href="sourcing.html#/requests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Requests</a>
    <a href="ops.html#/orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6"/></svg>Orders</a>
    <a href="app.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>Products</a>
    <a href="sourcing.html#/factories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V10l5 3V10l5 3V6l8 4v11z"/></svg>Factories</a>
    <a href="sourcing.html#/rates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/></svg>Rate cards</a>
    <div class="sect">Clients</div>
    <div class="clients" id="navClients"></div>
    <a href="sourcing.html#/clients" class="quiet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add a client</a>
    <div class="grow"></div>
    <a class="quiet" href="site/">Website</a>
    <div class="meta" id="sync">Connecting…</div>
  </nav><script src="nav.js?v=5"></script>

  <main class="dc-main">
    <div class="dc-bar"><h1>Home</h1><div class="sp"></div>
      <a class="pill" href="ops.html#/new" id="qcNewOrder" hidden>New order</a>
      <a class="pill dark" href="sourcing.html#/new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New request</a>
    </div>
    <div class="dc-wrap" id="app"><p style="color:var(--muted)">Loading…</p></div>
  </main>

  <aside class="op" aria-label="Operator">
    <div class="op-head"><span class="av op"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c0-4 3-6 8-6s8 2 8 6"/><circle cx="12" cy="7" r="3.5"/></svg></span>Operator<div class="sp"></div><button class="pill" id="opClear" title="Clear the conversation">Clear</button></div>
    <div class="op-log" id="opLog" aria-live="polite"></div>
    <div class="op-sug" id="opSug"></div>
    <form class="op-box" id="opForm"><textarea id="opIn" rows="1" placeholder="Ask Operator to source something…" aria-label="Message Operator"></textarea><button id="opSend" aria-label="Send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form>
  </aside>
</div>
<script>
(() => {
const CFG = window.DEFECT_CHECK_CONFIG || {};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const app = $('app');
const SV = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = { cal: SV('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'), clock: SV('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'), op: SV('<path d="M4 18c0-4 3-6 8-6s8 2 8 6"/><circle cx="12" cy="7" r="3.5"/>') };
const day0 = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const parseDay = (s) => s ? new Date(/^\d{4}-\d{2}-\d{2}$/.test(s) ? s + 'T00:00' : s) : null;
function due(s) {
  const d = parseDay(s); if (!d) return '';
  const diff = Math.round((day0(d) - day0(new Date())) / 864e5);
  const label = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : diff === -1 ? 'Yesterday' : diff > 1 && diff < 7 ? d.toLocaleDateString('en-US', { weekday: 'short' }) : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return `<span class="tag ${diff < 0 ? 'red' : diff === 0 ? 'blue' : ''}">${IC.cal}${label}</span>`;
}
const ago = d => { const s = (Date.now() - new Date(d).getTime()) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
let sb, ws, D = { reqs: [], clients: [], pos: [], negs: [], quotes: [] }, tab = 'all', ANON = false;

// What each request needs next, in plain words.
function nextStep(r) {
  const negs = D.negs.filter(n => n.request_id === r.id), qs = D.quotes.filter(q => q.request_id === r.id);
  const q = r.spec?.questions?.length || 0;
  switch (r.status) {
    case 'intake': return r.spec?.intake_at ? (q ? [`Answer ${q} question${q === 1 ? '' : 's'} from intake`, 'half'] : ['Spec ready, search for factories', 'half']) : ['Run intake on the brief', 'empty'];
    case 'sourcing': return ['Find factories on 1688', 'half'];
    case 'shortlisted': return ['Pick factories to contact', 'half'];
    case 'negotiating': { const w = negs.filter(n => n.status === 'waiting_us').length; return [w ? `${w} factor${w === 1 ? 'y is' : 'ies are'} waiting on you` : `Negotiating with ${negs.length || 'the'} factor${negs.length === 1 ? 'y' : 'ies'}`, 'half']; }
    case 'quoted': return qs.some(x => x.released_to_client) ? ['Waiting for the client to approve', 'half'] : ['Send the quote to the client', 'half'];
    case 'approved': return ['Place the order with the factory', 'half'];
    case 'ordered': return ['In production, inspect before the balance', 'half'];
    default: return ['Closed', 'full'];
  }
}
const clientName = (id) => { const c = D.clients.find(x => x.id === id); return c ? (c.company || c.name) : ''; };

function render() {
  const open = D.reqs.filter(r => r.status !== 'closed');
  const counts = {}; open.forEach(r => { const k = r.client_id || 'none'; counts[k] = (counts[k] || 0) + 1; });
  const shown = open.filter(r => tab === 'all' || (r.client_id || 'none') === tab);
  const waiting = open.filter(r => ['intake', 'shortlisted', 'quoted', 'approved'].includes(r.status) || D.negs.some(n => n.request_id === r.id && n.status === 'waiting_us'));
  const now = new Date();
  const greet = now.getHours() < 12 ? 'Good morning' : now.getHours() < 18 ? 'Good afternoon' : 'Good evening';
  const openPos = D.pos.filter(p => !p.closed);
  $('navClients').innerHTML = D.clients.map(c => `<a href="#" data-client="${c.id}"><i></i>${esc(c.company || c.name)}<b>${counts[c.id] || ''}</b></a>`).join('');
  app.innerHTML = `${ANON ? `<a href="sourcing.html#/account" style="display:block;background:var(--harbor-bg,#eef4f7);border-radius:12px;padding:12px 16px;margin-bottom:14px;color:inherit;text-decoration:none;font-size:14px"><b>You're not signed in.</b> Your work is saved, but only this browser can open it. <u>Sign in or create an account →</u></a>` : ''}<div class="hello"><h2>${greet}</h2><p>${now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}. ${waiting.length ? `${waiting.length} request${waiting.length === 1 ? ' needs' : 's need'} you.` : open.length ? 'Nothing is waiting on you.' : 'No open requests yet.'}</p></div>
  ${open.length ? `<div class="tabs" role="group" aria-label="Filter by client"><button data-tab="all" aria-pressed="${tab === 'all'}">All clients <span>${open.length}</span></button>${D.clients.filter(c => counts[c.id]).map(c => `<button data-tab="${c.id}" aria-pressed="${tab === c.id}">${esc(c.company || c.name)} <span>${counts[c.id]}</span></button>`).join('')}${counts.none ? `<button data-tab="none" aria-pressed="${tab === 'none'}">No client <span>${counts.none}</span></button>` : ''}</div>` : ''}
  ${shown.length ? `<ul class="rows">${shown.map(r => { const [step, ring] = nextStep(r); const attn = waiting.includes(r);
      return `<li><a class="row" href="sourcing.html#/request/${r.id}"><span class="ring ${ring}"></span><span class="t"><b>${esc(r.title)}</b><small>${esc(step)}${r.quantity ? `, ${Number(r.quantity).toLocaleString()} units` : ''}</small></span><span class="chips">${attn ? '<span class="tag dot" title="Needs you"></span>' : ''}${due(r.deadline)}${r.client_id ? `<span class="tag">${esc(clientName(r.client_id))}</span>` : ''}</span></a></li>`; }).join('')}</ul>`
    : `<div class="dc-empty">${open.length ? 'Nothing for this client.' : 'Tell Operator what a client wants made, or <a href="sourcing.html#/new">create a request</a>. It structures the spec, finds factories and works out the landed cost.'}</div>`}
  ${window.LATHE_SHOW_QC && openPos.length ? `<div class="dc-sec">Orders in progress</div><ul class="rows">${openPos.map(p => `<li><a class="row" href="ops.html#/po/${p.id}"><span class="ring half"></span><span class="t"><b>${esc(p.po_number)}</b><small>${esc(p.supplier_name || 'Factory')}${p.supplier_city ? ', ' + esc(p.supplier_city) : ''}</small></span><span class="chips">${due(p.ship_by)}<span class="tag">Order</span></span></a></li>`).join('')}</ul>` : ''}`;
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.querySelectorAll('[data-client]').forEach(a => a.onclick = (e) => { e.preventDefault(); tab = a.dataset.client; render(); });
}

async function load() {
  const q = (t, sel, order) => sb.from(t).select(sel).eq('workspace_id', ws).order(order, { ascending: false }).limit(300);
  const r = await Promise.all([
    q('sourcing_requests', 'id, title, status, client_id, quantity, deadline, spec, updated_at', 'updated_at'),
    q('clients', 'id, name, company', 'created_at'),
    q('purchase_orders', 'id, po_number, supplier_name, supplier_city, ship_by, closed', 'created_at'),
    q('negotiations', 'id, request_id, status', 'updated_at'),
    q('quotes', 'id, request_id, released_to_client, status', 'created_at'),
  ]);
  [D.reqs, D.clients, D.pos, D.negs, D.quotes] = r.map(x => x.data || []);
}

// ---------- Operator ----------
const LOG_KEY = 'dc-operator-log';
let log = []; try { log = JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch {}
const saveLog = () => { try { localStorage.setItem(LOG_KEY, JSON.stringify(log.slice(-40))); } catch {} };
const tm = (d) => new Date(d).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const linkify = (s) => esc(s).replace(/\[([^\]]+)\]\(((?:sourcing|ops|app)\.html#\/[\w\/-]+)\)/g, '<a href="$2">$1</a>');
function drawLog(busy) {
  $('opLog').innerHTML = log.map(m => `<div class="msg"><span class="av ${m.role === 'op' ? 'op' : ''}">${m.role === 'op' ? IC.op : 'G'}</span><div><div class="who">${m.role === 'op' ? 'Operator' : 'You'}<time>${tm(m.at)}</time></div><div class="body">${linkify(m.text)}</div>${m.done ? `<span class="done">✓ ${esc(m.done)}</span>` : ''}</div></div>`).join('')
    + (busy ? `<div class="msg"><span class="av op">${IC.op}</span><div><div class="who">Operator</div><div class="typing"><i></i><i></i><i></i></div></div></div>` : '');
  $('opLog').scrollTop = $('opLog').scrollHeight;
  const sug = ['Source 1,000 foldable camping chairs for SUNNYPRO, about $9.50 landed, needed by December', "What's waiting on me?", 'Add a client called Brightside Home'];
  $('opSug').innerHTML = log.length || busy ? '' : sug.map(s => `<button type="button">${esc(s)}</button>`).join('');
  $('opSug').querySelectorAll('button').forEach(b => b.onclick = () => send(b.textContent));
}
async function call(task, body) {
  const { data, error } = await sb.functions.invoke('sourcing', { body: { task, ...body } });
  if (error) { let m = error.message; try { const j = await error.context?.json(); if (j?.error) m = j.error; } catch {} throw new Error(m); }
  if (data?.error) throw new Error(data.error);
  return data;
}
async function findOrMakeClient(name) {
  if (!name) return null;
  const n = name.toLowerCase();
  const c = D.clients.find(x => [x.name, x.company].filter(Boolean).some(v => v.toLowerCase() === n || v.toLowerCase().includes(n) || n.includes(v.toLowerCase())));
  if (c) return c.id;
  const { data } = await sb.from('clients').insert({ workspace_id: ws, name, company: name }).select('id').single();
  return data?.id || null;
}
async function send(text) {
  text = text.trim(); if (!text || !sb) return;
  log.push({ role: 'me', text, at: new Date().toISOString() }); saveLog(); drawLog(true);
  $('opIn').value = ''; $('opSend').disabled = true;
  try {
    const out = await call('operator', { lang: window.LatheLang || 'en', message: text, history: log.slice(-9, -1).map(m => ({ role: m.role === 'op' ? 'operator' : 'user', text: m.text })) });
    const a = out.action; let reply = out.reply || 'Done.', done = '';
    if (a?.type === 'create_request') {
      const client_id = await findOrMakeClient(a.client_name);
      const { data: r, error } = await sb.from('sourcing_requests').insert({ workspace_id: ws, client_id, title: a.title || 'New request', raw_brief: a.brief || text, quantity: a.quantity || null, target_unit_price: a.target_unit_price || null, deadline: a.deadline || null }).select('id').single();
      if (error) throw error;
      log.push({ role: 'op', text: reply, at: new Date().toISOString() }); saveLog(); await load(); render(); drawLog(true);
      try {
        const it = await call('intake', { request_id: r.id }); const sp = it.spec || {};
        reply = `Spec is ready for [${a.title}](sourcing.html#/request/${r.id}).` + (sp.estimated_factory_price_cny ? ` Rough factory price is around ¥${sp.estimated_factory_price_cny} a unit.` : '') + (sp.questions?.length ? `\n\nBefore I search factories, the client should answer:\n${sp.questions.map((x, i) => `${i + 1}. ${x}`).join('\n')}` : ' Nothing is missing, so it can go straight to the factory search.');
        done = 'Request created, intake done';
      } catch (e) { reply = `I created [${a.title}](sourcing.html#/request/${r.id}), but intake failed: ${e.message}`; }
    } else if (a?.type === 'create_client') {
      const { data: c, error } = await sb.from('clients').insert({ workspace_id: ws, name: a.name, company: a.company || null, email: a.email || null }).select('portal_token').single();
      if (error) throw error;
      reply += `\n\nTheir portal link: ${new URL('portal.html?c=' + c.portal_token, location.href).href}`; done = 'Client added';
    } else if (a?.type === 'open' && a.href) { reply += `\n\n[Open it](${a.href})`; }
    log.push({ role: 'op', text: reply, at: new Date().toISOString(), done }); saveLog();
    await load(); render();
  } catch (e) {
    log.push({ role: 'op', text: `That didn't work: ${e.message}`, at: new Date().toISOString() }); saveLog();
  }
  drawLog(false);
}
$('opForm').onsubmit = (e) => { e.preventDefault(); send($('opIn').value); };
$('opIn').oninput = (e) => { $('opSend').disabled = !e.target.value.trim(); e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 180) + 'px'; };
$('opIn').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send($('opIn').value); } };
$('opClear').onclick = () => { log = []; saveLog(); drawLog(false); };
drawLog(false);

(async () => {
  if (!CFG.supabaseUrl || !window.supabase) { app.innerHTML = '<p>Setup needed: add your Supabase URL and anon key to config.js.</p>'; return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  let { data: { session } } = await sb.auth.getSession();
  if (!session) { const { data, error } = await sb.auth.signInAnonymously(); if (error) { app.innerHTML = `<p>Could not open your workspace: ${esc(error.message)}</p>`; return; } session = data.session; }
  // after an email sign-in link, continue to where the person was going (account page, an invite, …)
  let next = null; try { next = localStorage.getItem('lathe-after-login'); } catch (e) {}
  if (next && !session.user.is_anonymous) { try { localStorage.removeItem('lathe-after-login'); } catch (e) {} location.replace(next); return; }
  const { data: m0 } = await sb.from('workspace_members').select('workspace_id, workspaces(name)').eq('user_id', session.user.id).order('created_at');
  if (!m0 || !m0.length) { app.innerHTML = '<p>No workspace found for this account.</p>'; return; }
  let pref = null; try { pref = localStorage.getItem('lathe-ws'); } catch (e) {}
  const m = [m0.find(x => x.workspace_id === pref) || m0[0]];
  ws = m[0].workspace_id; ANON = !!session.user.is_anonymous;
  await load(); render();
  let t = null; const ch = sb.channel('home-' + ws);
  ['sourcing_requests', 'clients', 'purchase_orders', 'negotiations', 'quotes'].forEach(tb => ch.on('postgres_changes', { event: '*', schema: 'public', table: tb, filter: 'workspace_id=eq.' + ws }, () => { clearTimeout(t); t = setTimeout(async () => { await load(); render(); }, 500); }));
  ch.subscribe(st => { $('sync').textContent = st === 'SUBSCRIBED' ? (m[0].workspaces?.name || 'My workspace') + ', live' : 'Reconnecting…'; });
})();
})();
</script>
</body></html>
