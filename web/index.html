<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Defect Check</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14202A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#F2F4F3;--panel:#FFFFFF;--sunk:#F2F4F3;--ink:#16212A;--muted:#5E6A72;--line:#E3E8EA;--line2:#D3DADE;--pass:#16794F;--fail:#B4271C;--review:#3F4FB0;--retake:#9A6700;--mark:#D0157F;--focus:#2457C5;--pass-bg:#E3F2EA;--fail-bg:#FBE7E4;--review-bg:#E8EBF9;--retake-bg:#F8EDD5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A1F;--panel:#1C242B;--sunk:#182026;--ink:#E7ECEF;--muted:#98A5AF;--line:#2B353D;--line2:#3A4650;--pass:#43BE8D;--fail:#F2695A;--review:#8E97F2;--retake:#E4AE35;--mark:#FF4DB0;--focus:#7AA7FF;--pass-bg:#1D3A2F;--fail-bg:#44221F;--review-bg:#2A2F52;--retake-bg:#3E3219}}
:root[data-theme="dark"]{--bg:#141A1F;--panel:#1C242B;--sunk:#182026;--ink:#E7ECEF;--muted:#98A5AF;--line:#2B353D;--line2:#3A4650;--pass:#43BE8D;--fail:#F2695A;--review:#8E97F2;--retake:#E4AE35;--mark:#FF4DB0;--focus:#7AA7FF;--pass-bg:#1D3A2F;--fail-bg:#44221F;--review-bg:#2A2F52;--retake-bg:#3E3219}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:19px;font-weight:800;font-stretch:112%;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{border:0;background:none;font-weight:700;font-size:16px;padding:4px 6px 4px 0;cursor:pointer}
.sync{font-size:12.5px;color:var(--muted);white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bottom:empty{display:none}
.bottom .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 16px;font-weight:700;font-size:15.5px;cursor:pointer;text-align:center;min-height:48px}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.grow{flex:1}
.btn.small{padding:7px 12px;min-height:36px;font-size:14px;border-radius:8px}
.btn.danger{color:var(--fail)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:14px;color:var(--muted);margin:6px 0 0}
.warn{background:var(--retake-bg);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.big2 button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;cursor:pointer;min-height:118px}
.big2 button b{font-size:18px;font-stretch:108%}
.big2 button span{font-size:13.5px;color:var(--muted)}
.big2 button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.big2 button.primary span{color:color-mix(in srgb,var(--panel) 75%,transparent)}
h2{font-size:17px;margin:22px 0 8px;font-weight:800}
h2:first-child{margin-top:4px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;text-align:left;width:100%}
.row img,.row .ph{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--sunk);display:block}
.row b{display:block;font-size:15.5px}
.row small{color:var(--muted);font-size:13px}
.chip{display:inline-block;padding:2px 8px;border-radius:5px;font-weight:800;font-size:12px;letter-spacing:.02em}
.chip.PASS{background:var(--pass-bg);color:var(--pass)}.chip.FAIL{background:var(--fail-bg);color:var(--fail)}.chip.REVIEW{background:var(--review-bg);color:var(--review)}.chip.RETAKE{background:var(--retake-bg);color:var(--retake)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:14.5px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sec h3{margin:0 0 2px;font-size:16px}
.sec > p{margin:2px 0 12px;color:var(--muted);font-size:14px}
label.f{display:block;margin:12px 0 0;font-size:14px;font-weight:600}
label.f span{display:block;font-weight:400;color:var(--muted);font-size:13px}
input.i,select.i,textarea.i{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);font-size:16px;font-weight:400}
textarea.i{min-height:88px;resize:vertical}
.dims{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dims label{font-size:13px;color:var(--muted);font-weight:400;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--sunk);border-radius:18px;padding:7px 13px;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ptile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.ptile img{width:100%;height:100%;object-fit:cover;display:block}
.ptile select{position:absolute;left:4px;right:4px;bottom:4px;font-size:12.5px;padding:3px 4px;border-radius:6px;border:0;background:rgba(0,0,0,.62);color:#fff}
.ptile .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:16px;line-height:28px;cursor:pointer}
.ptile .st{position:absolute;top:4px;left:4px;font-size:11.5px;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.62);color:#fff}
.addtile{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);padding:6px}
.addtile i{font-style:normal;font-size:26px;line-height:1}
.addtile small{font-weight:400;color:var(--muted);font-size:12px}
.stamp{font-weight:800;font-stretch:125%;font-size:52px;line-height:1;padding:10px 14px 8px;border:3px solid currentColor;border-radius:8px;display:inline-block;transform:rotate(-1.5deg);margin:6px 0 10px}
.stamp.PASS{color:var(--pass)}.stamp.FAIL{color:var(--fail)}.stamp.REVIEW{color:var(--review)}.stamp.RETAKE{color:var(--retake)}.stamp.WAIT,.stamp.PENDING{color:var(--muted);border-style:dashed;font-size:34px}
.chip.PENDING,.chip.CHECKING{background:var(--sunk);color:var(--muted)}
.chip.ERROR{background:var(--retake-bg);color:var(--retake)}
.stamp.CHECKING{color:var(--muted);border-style:dashed;font-size:34px}
.stamp.ERROR{color:var(--retake);font-size:34px}
.pastebox{grid-column:1/-1;border:1.5px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--muted);font-size:14px;min-height:44px;cursor:text;outline:none;caret-color:transparent;overflow:hidden;max-height:60px}
.pastebox:focus{border-color:var(--focus);color:var(--ink)}
.photos.drag{outline:2px dashed var(--focus);outline-offset:4px;border-radius:10px}
@media (prefers-reduced-motion:no-preference){.stamp.pop{animation:pop .35s ease-out}.stamp.WAIT{animation:breathe 1.6s ease-in-out infinite}}
@keyframes pop{from{transform:rotate(-1.5deg) scale(1.15);opacity:.3}to{transform:rotate(-1.5deg) scale(1);opacity:1}}
@keyframes breathe{50%{opacity:.45}}
.who{font-size:13px;color:var(--muted)}
.sum{font-size:17px;font-weight:600;margin:4px 0 4px}
.shot{position:relative;margin:10px 0;border-radius:10px;overflow:hidden;background:#000}
.shot img{display:block;width:100%;height:auto}
.box{position:absolute;border:2.5px dashed var(--mark);border-radius:4px;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.box span{position:absolute;left:-2px;top:-24px;background:var(--mark);color:#fff;font-size:12px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
.shot .cap{position:absolute;left:8px;bottom:8px;font-size:12px;color:#fff;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:5px}
.def{border-left:4px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14.5px}
.def.critical,.def.major{border-left-color:var(--fail)}.def.minor{border-left-color:var(--review)}
.def b{font-size:15px}
.def small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
ul.ck{list-style:none;padding:0;margin:0}
ul.ck li{display:grid;grid-template-columns:24px 1fr;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
ul.ck li:last-child{border-bottom:0}
.g{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;grid-row:span 2}
.g.pass{background:var(--pass)}.g.fail{background:var(--fail)}.g.unclear{background:var(--line);color:var(--ink)}
ul.ck small{color:var(--muted);font-size:13px}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14.5px}
dl.spec dt{color:var(--muted)}
dl.spec dd{margin:0;white-space:pre-line}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip img{width:92px;height:92px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:var(--sunk)}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14.5px}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:14.5px;max-width:92vw;z-index:20;display:none}
#toast.on{display:block}
.lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.choose{display:grid;gap:10px}
.choose button{display:block;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:18px 16px;cursor:pointer}
.choose b{display:block;font-size:18px;font-stretch:108%;margin-bottom:4px}
.choose span{color:var(--muted);font-size:14.5px}
.choose em{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:8px}
a.src{color:var(--focus);word-break:break-all}
.ptile.bad{outline:3px solid var(--retake);outline-offset:-3px}
.ptile.bad .st{background:var(--retake);color:#111}
.covbox{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.covbox p{flex-basis:100%}
.cov{display:inline-block;border-radius:16px;padding:5px 11px;font-size:13.5px;font-weight:700;border:1px solid var(--line)}
.cov.ok{background:var(--pass-bg);color:var(--pass);border-color:transparent}
.cov.miss{background:var(--panel);border:1.5px dashed var(--retake);color:var(--ink);cursor:pointer}
.badlist{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--retake);flex-basis:100%}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.og{display:inline-block;padding:2px 8px;border-radius:5px;font-weight:700;font-size:12.5px;background:var(--sunk);color:var(--muted)}
.og.none{background:var(--pass-bg);color:var(--pass)}.og.transit{background:var(--retake-bg);color:var(--retake)}.og.factory{background:var(--fail-bg);color:var(--fail)}.og.both{background:var(--fail-bg);color:var(--fail)}.og.unclear{background:var(--review-bg);color:var(--review)}
.where{font-size:22px;font-weight:800;font-stretch:112%;margin:4px 0 6px}
.where.none{color:var(--pass)}.where.transit{color:var(--retake)}.where.factory,.where.both{color:var(--fail)}.where.unclear{color:var(--review)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pair figure{margin:0}.pair img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--sunk);display:block}
.pair figcaption{font-size:12.5px;color:var(--muted);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:6px}
.stats div{background:var(--sunk);border-radius:10px;padding:10px 12px}.stats b{display:block;font-size:22px;font-stretch:112%}.stats span{font-size:13px;color:var(--muted)}
.lotrow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.lotrow small{color:var(--muted);font-size:13px;display:block}
.linkbox{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;word-break:break-all;margin-top:8px}
.lang{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 9px;font-weight:700;font-size:13px;cursor:pointer}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--muted)}
.mh{margin:6px 0 0;padding-left:18px;font-size:14.5px}.mh li{margin:3px 0}
.cam{position:fixed;inset:0;z-index:40;background:#000;display:none;flex-direction:column}
.cam.on{display:flex}
.cam video{flex:1;width:100%;min-height:0;object-fit:contain;background:#000}
.camtop,.cambar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;color:#fff;font-size:14px}
.camtop{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.cambar{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.cambar button,.camtop button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;min-width:72px}
.cam .shutter{width:72px;height:72px;min-width:72px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.45);background-clip:padding-box;padding:0}
.cam .shutter:active{transform:scale(.94)}
.pickcard{border:2px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:14px;background:var(--panel)}
.pickcard .big{font-size:28px;font-weight:800;font-stretch:112%;margin:4px 0}
.timer{font-weight:800;font-variant-numeric:tabular-nums}.timer.low{color:var(--fail)}
table.log{width:100%;border-collapse:collapse;font-size:13.5px}table.log th,table.log td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.logwrap{overflow-x:auto}
/* ---------- visual refresh: quieter surfaces, consistent sizes, one bold element (the verdict stamp) ---------- */
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;gap:12px}
.top h1{font-size:17px;font-weight:700;font-stretch:100%;letter-spacing:-.01em}
.top .back{color:var(--focus);font-weight:600;font-size:15px}
.sync{font-size:12px}
main{max-width:600px;padding:20px 16px 128px}
.bottom{background:color-mix(in srgb,var(--panel) 94%,transparent);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px;min-height:48px;transition:background-color .12s}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 88%,var(--panel))}
.btn.small{padding:7px 12px;min-height:34px;font-size:13.5px;border-radius:9px}
.btn.danger{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 30%,var(--line2))}
h2{font-size:13.5px;font-weight:600;color:var(--muted);margin:28px 4px 10px;letter-spacing:.01em}
h2:first-child{margin-top:4px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px}
.sec h3{font-size:16px;font-weight:700;margin:0 0 4px;letter-spacing:-.005em}
.sec > p{margin:0 0 14px;font-size:14px;line-height:1.55}
.note{font-size:13.5px;line-height:1.5}
.warn{border-radius:12px;padding:12px 14px;line-height:1.5}
.big2{gap:12px;margin-bottom:28px}
.big2 button{border:1px solid var(--line);border-radius:16px;padding:18px;min-height:128px;gap:6px}
.big2 button b{font-size:17px;font-stretch:100%;font-weight:700}
.big2 button span{font-size:13.5px;line-height:1.45}
.list{gap:8px}
.row{grid-template-columns:56px 1fr auto;gap:14px;border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 10px}
.row:hover{border-color:var(--line2)}
.row img,.row .ph{width:56px;height:56px;border-radius:10px}
.row b{font-size:15px;font-weight:600;margin-bottom:2px}
.row > span:last-child{color:var(--muted)}
.chip{border-radius:999px;padding:3px 10px;font-weight:700;font-size:11.5px;letter-spacing:.02em}
.empty{background:var(--panel);border:1px dashed var(--line2);border-radius:14px;padding:22px;line-height:1.5}
label.f{margin:16px 0 0;font-size:13.5px;font-weight:600}
label.f span{font-size:12.5px;margin-top:1px}
input.i,select.i,textarea.i{margin-top:6px;padding:11px 13px;border:1px solid var(--line2);border-radius:10px;background:var(--panel)}

.chips button{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:13.5px}
.photos{gap:10px}
.ptile{border-radius:12px;border:1px solid var(--line)}
.addtile{border:1.5px dashed var(--line2);border-radius:12px;background:var(--panel);font-weight:600;font-size:13.5px}
.addtile i{font-size:22px;color:var(--muted)}
.pastebox{border:1.5px dashed var(--line2);border-radius:12px;background:var(--panel);font-size:13px}
.stamp{font-size:46px;letter-spacing:.01em;border-width:3px;border-radius:10px;padding:8px 16px 6px;margin:4px 0 12px}
.sum{font-size:16.5px;font-weight:600;line-height:1.45;margin:2px 0 8px}
.who{font-size:12.5px;line-height:1.5}
.shot{border-radius:14px;margin:12px 0}

  ${a.checks.length ? `<div class="sec"><h3>Against the standard</h3><ul class="ck">${a.checks.map(c => `<li><span class="g ${c.result}">${G[c.result]}</span><span>${esc(c.item)}</span><small>${esc(c.note)}</small></li>`).join('')}</ul></div>` : ''}
  <div class="sec"><h3>Your decision</h3><p>AI screening can miss things and flag harmless ones. The final call on shipment is a person's.</p>
    <div class="decide"><button class="btn" data-a="decide" data-v="PASS" data-id="${esc(i.id)}" ${d === 'PASS' && i.decision ? 'disabled' : ''}>Mark as pass</button><button class="btn" data-a="decide" data-v="FAIL" data-id="${esc(i.id)}" ${d === 'FAIL' && i.decision ? 'disabled' : ''}>Mark as fail</button></div>
    <div style="margin-top:14px"><button class="btn small danger" data-a="delInsp" data-id="${esc(i.id)}">Delete this check</button></div></div>`;
  bar((i.lot && i.productId && i.stage !== 'arrival' ? `<button class="btn" data-a="openLot" data-id="${esc(lotKey(i.productId, i.lot))}">Lot report</button>` : '') + (p ? `<button class="btn primary grow" data-a="check" data-id="${esc(p.id)}">Check next unit</button>` : ''));
}

function whereHtml(i, a, pending) {
  const f = i.originId ? S.inspections.find(x => x.id === i.originId) : null, rec = (a.factory && a.factory.record) || [];
  const head = pending ? '<p class="note">Comparing with the factory check once the result is in.</p>' : `<div class="where ${esc(i.damageOrigin || 'unclear')}">${esc(ORIGIN[i.damageOrigin] || ORIGIN.unclear)}</div>${a.originSummary ? `<p style="margin:0 0 6px">${esc(a.originSummary)}</p>` : ''}`;
  const pairs = f ? (i.photos || []).map(u => { const b = (f.photos || []).find(x => x.view && x.view === u.view); return b ? `<figure><img src="${esc(srcOf(b))}" alt="" data-zoom="${esc(srcOf(b))}"><figcaption>Factory, ${esc(new Date(f.createdAt).toLocaleDateString())}: ${esc(b.part || b.view)}</figcaption></figure><figure><img src="${esc(srcOf(u))}" alt="" data-zoom="${esc(srcOf(u))}"><figcaption>On arrival: ${esc(u.part || u.view)}</figcaption></figure>` : ''; }).join('') : '';
  return `<div class="sec"><h3>Where it happened</h3>${head}
    ${pairs ? `<div class="pair">${pairs}</div>` : ''}
    ${rec.length ? `<ul class="badlist" style="color:var(--ink)">${rec.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${f ? `<button class="btn small" data-a="openInsp" data-id="${esc(f.id)}">Open factory check</button>` : ''}${i.lot && i.productId ? `<button class="btn small" data-a="openLot" data-id="${esc(lotKey(i.productId, i.lot))}">Lot ${esc(i.lot)} report</button>` : ''}</div>
    <p class="note">Where-it-happened is an AI judgment from the photos. It's strongest when the same unit was photographed at the factory.</p></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const z = e.target.closest('[data-zoom]'); if (z && !e.target.closest('[data-a]')) return zoom(z.dataset.zoom);
  const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, id = b.dataset.id;
  if (a === 'new') { S.draft = null; go('edit', null); }
  else if (a === 'openProd') go('product', id);
  else if (a === 'openInsp') go('insp', id);
  else if (a === 'openLot') go('lot', id);
  else if (a === 'newLink') { S.linkDraft = null; go('newlink', id); }
  else if (a === 'cancelLink') { S.linkDraft = null; back(); }
  else if (a === 'createLink') createLink();
  else if (a === 'copyLink') { const l = S.links.find(x => x.id === id); if (l) copyText(linkUrl(l), 'Link copied.'); }
  else if (a === 'copyMsg') { const l = S.links.find(x => x.id === id); if (l) copyText(linkMsg(l, prodById(l.product_id)), 'Message copied. Paste it into WeChat or email.'); }
  else if (a === 'toggleLink') { const l = S.links.find(x => x.id === id); if (!l) return; const open = linkOpen(l), patch = open ? { active: false } : { active: true, expires_at: new Date(Math.max(Date.now() + 30 * 864e5, new Date(l.expires_at).getTime())).toISOString() };
    const { data, error } = await sb.from('factory_links').update(patch).eq('id', id).select().single(); if (error) toast("Couldn't update the link."); else { Object.assign(l, data); render(); toast(open ? 'Link closed. The factory can no longer submit.' : 'Link reopened.'); } }
  else if (a === 'lang') { S.lang = S.lang === 'zh' ? 'en' : 'zh'; try { localStorage.setItem('dc_lang', S.lang); } catch { } render(); }
  else if (a === 'fOpen') go('fres', id);
  else if (a === 'fNext') { if (!S.factory.pick) S.check = null; S.route = { name: 'factory' }; S.stack = []; render(); window.scrollTo(0, 0); }
  else if (a === 'fStart') factoryStart();
  else if (a === 'fNextPick') factoryNextPick();
  else if (a === 'camOpen') openCam();
  else if (a === 'camShot') camShot();
  else if (a === 'camClose') closeCam();
  else if (a === 'cancelSession') { if (!confirm('Cancel this sample and let the factory start a new one? The checks already done stay in the history.')) return; const { error } = await sb.from('factory_sessions').update({ status: 'cancelled' }).eq('id', id); if (error) toast("Couldn't cancel."); else { await reloadLinks(); render(); toast('Sample cancelled. The factory can lock the lot again.'); } }
  else if (a === 'openLog') go('slog', id);
  else if (a === 'fRecheck') { const u = S.factory.units.find(x => x.id === id); if (!u) return; S.check = { productId: 'factory', unit: u.unit, worker: S.factory.worker, hints: (u.ai && u.ai.more) || [], photos: u.photos.map(ph => ({ ...ph, id: ph.path, key: uid(), state: 'ok', idState: 'done', quality: 'ok', userView: true })) }; S.route = { name: 'factory' }; S.stack = []; render(); window.scrollTo(0, 0); }
  else if (a === 'fRetry') { const u = S.factory.units.find(x => x.id === id); if (!u) return; u.status = 'pending'; u.error = null; render(); try { const r = await callQC({ task: 'factory_retry', id }); Object.assign(u, fUnit(r.unit)); } catch (e) { u.status = 'error'; u.error = sampleErr(e); } render(); }
  else if (a === 'stage') { if (S.check) { S.check.stage = b.dataset.v; S.check.originId = ''; S.lastStage = b.dataset.v; checkUnit(S.check.productId); } }
  else if (a === 'arrivalFor') { const [pid, ...rest] = id.split('|'); S.check = { productId: pid, photos: [], lot: rest.join('|'), unit: '', careful: false, hints: [], stage: 'arrival', originId: '' }; S.lastStage = 'arrival'; go('check', pid); }
  else if (a === 'copyClaim') { const t = claimText(id); try { await navigator.clipboard.writeText(t); toast('Claim summary copied.'); } catch { prompt('Copy the summary:', t); } }
  else if (a === 'edit') { S.draft = null; go('edit', id); }
  else if (a === 'cancelEdit') { S.draft = null; back(); }
  else if (a === 'save') saveProduct();
  else if (a === 'fill') fillFromPhotos();
  else if (a === 'readListing') readListing();
  else if (a === 'mode') { if (S.draft) { S.draft.mode = b.dataset.v; editProduct(S.draft._for === 'new' ? null : S.draft._for); window.scrollTo(0, 0); } }
  else if (a === 'checkStart') go('pick');
  else if (a === 'check') { if (S.route.name === 'pick') { S.route = S.stack.pop() || { name: 'home' }; } go('check', id); }
  else if (a === 'cam' || a === 'lib') pickPhotos(b.dataset.kind, b.dataset.view, a === 'cam');
  else if (a === 'rm') { const bag = b.dataset.kind === 'draft' ? S.draft.photos : S.check.photos; bag.splice(+b.dataset.i, 1); b.dataset.kind === 'draft' ? drawDraftPhotos() : drawCheckPhotos(); }
  else if (a === 'run') runCheck();
  else if (a === 'recheck') {
    const i = S.inspections.find(x => x.id === id) || S.lastInspection; if (!i) return;
    S.check = { productId: i.productId, lot: i.lot || '', unit: i.unit || '', careful: false, recheckOf: i.id, hints: (i.ai.more || []), stage: i.stage || 'factory', originId: i.originId || '',
      photos: i.photos.map(ph => ({ ...ph, key: uid(), state: ph.id ? 'ok' : 'local', idState: 'done', quality: 'ok', userView: true })) };
    go('check', i.productId);
  }
  else if (a === 'stop') S.check && S.check.ctl && S.check.ctl.abort();
  else if (a === 'decide') { const { data: r, error } = await sb.from('inspections').update({ decision: { final: b.dataset.v, at: new Date().toISOString(), by: S.user.email } }).eq('id', id).select().single(); if (error) toast("Couldn't save the decision."); else { upsertLocal('inspections', r); render(); toast(`Marked as ${b.dataset.v.toLowerCase()}.`); } }
  else if (a === 'retry') { const i = S.inspections.find(x => x.id === id); if (i) { i.status = 'pending'; i.error = null; render(); runInspect(id); } }
  else if (a === 'importUrl') importUrl();
  else if (a === 'signout') { await sb.auth.signOut(); location.reload(); }
  else if (a === 'sendLink') sendLink();
  else if (a === 'delInsp') { if (confirm('Delete this check record?')) { await delDoc('inspections', id).catch(() => toast("Couldn't delete.")); back(); } }
  else if (a === 'delProd') { if (confirm('Delete this product and its standard? Past checks stay in the history.')) { await delDoc('products', id).catch(() => toast("Couldn't delete.")); S.route = { name: 'home' }; S.stack = []; render(); } }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && S.draft) { S.draft[t.dataset.f] = t.value; if (t.dataset.f === 'sourceUrl' || t.dataset.f === 'listingText') urlHint(); }
  else if (t.dataset.dim && S.draft) S.draft.dims[t.dataset.dim] = t.value;
  else if (t.dataset.c && S.check) { S.check[t.dataset.c] = t.type === 'checkbox' ? t.checked : t.value; if (t.dataset.c === 'lot' || t.dataset.c === 'unit') drawMatch(); }
  else if (t.dataset.l && S.linkDraft) S.linkDraft[t.dataset.l] = t.value;
  else if (t.dataset.d && S.factory) { S.factory.decl = S.factory.decl || {}; S.factory.decl[t.dataset.d] = t.type === 'checkbox' ? t.checked : t.value; }
  else if (t.dataset.f2 === 'worker' && S.factory) { S.factory.worker = t.value; try { localStorage.setItem('dc_worker', t.value); } catch { } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.d && S.factory && t.type === 'checkbox') { S.factory.decl = S.factory.decl || {}; S.factory.decl.numbered = t.checked; return; }
  if (t.dataset.view) { const bag = t.dataset.view === 'draft' ? S.draft.photos : S.check.photos, ph = bag[+t.dataset.i]; if (t.value !== '__part') { ph.view = t.value; ph.part = ''; ph.userView = true; if (ph.quality === 'wrong_product') ph.quality = 'ok'; } t.dataset.view === 'draft' ? drawDraftPhotos() : drawCheckPhotos(); }
  else if (t.dataset.c && S.check) { S.check[t.dataset.c] = t.type === 'checkbox' ? t.checked : t.value; if (t.dataset.c === 'originId') drawMatch(); }
});
document.addEventListener('click', e => {
  const c = e.target.closest('[data-chips] button'); if (!c || !S.draft) return;
  const f = c.parentElement.dataset.chips, v = c.dataset.v, arr = S.draft[f], k = arr.indexOf(v);
  if (k >= 0) arr.splice(k, 1); else arr.push(v); c.setAttribute('aria-pressed', k < 0);
});

/* ---------- sign-in + boot ---------- */
function loadingView() { $('#ttl').textContent = 'Defect Check'; app.innerHTML = `<p class="note">${S.setupMsg ? S.setupMsg : 'Loading…'}</p>`; }
function loginView() {
  $('#ttl').textContent = 'Defect Check';
  app.innerHTML = `<div class="sec"><h3>Sign in</h3><p>We'll email you a sign-in link. No password needed.</p>
    <label class="f">Email<input class="i" type="email" id="email" autocomplete="email" inputmode="email" placeholder="you@company.com"></label>
    <button class="btn primary" data-a="sendLink" style="width:100%;margin-top:14px">Email me a sign-in link</button><p class="note" id="loginNote"></p></div>`;
}
async function sendLink() {
  const email = ($('#email').value || '').trim(); if (!/.+@.+\..+/.test(email)) { toast('Enter your email address.'); return; }
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  $('#loginNote').textContent = error ? error.message : `Link sent to ${email}. Open it on this device to sign in.`;
}
async function start(session) {
  if (S.user) return; S.user = session.user;
  const { data: m, error } = await sb.from('workspace_members').select('workspace_id, workspaces(name)').eq('user_id', S.user.id).order('created_at').limit(1);
  if (error || !m || !m.length) { S.setupMsg = 'No workspace found for this account. Check that the database migration ran.'; S.route = { name: 'loading' }; render(); return; }
  S.ws = m[0].workspace_id; S.wsName = (m[0].workspaces && m[0].workspaces.name) || '';
  await Promise.all([reload('products'), reload('inspections'), reloadLinks()]);
  sb.channel('ws-' + S.ws)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'products', filter: 'workspace_id=eq.' + S.ws }, () => reload('products').then(rer))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'inspections', filter: 'workspace_id=eq.' + S.ws }, () => reload('inspections').then(rer))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'factory_links', filter: 'workspace_id=eq.' + S.ws }, () => reloadLinks().then(rer))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'factory_sessions', filter: 'workspace_id=eq.' + S.ws }, () => reloadLinks().then(rer))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'factory_picks', filter: 'workspace_id=eq.' + S.ws }, () => reloadLinks().then(rer))
    .subscribe();
  S.ready = true; setSync(); S.route = { name: 'home' }; S.stack = []; render();
}
async function reloadLinks() {
  const [l, se, pk] = await Promise.all([sb.from('factory_links').select('*').eq('workspace_id', S.ws).order('created_at', { ascending: false }),
    sb.from('factory_sessions').select('*').eq('workspace_id', S.ws).order('created_at', { ascending: false }),
    sb.from('factory_picks').select('*').eq('workspace_id', S.ws).order('seq')]);
  S.links = l.data || []; S.sessions = se.data || []; S.picks = pk.data || [];
}
async function reload(col) {
  const q = col === 'products' ? sb.from('products').select('*').eq('workspace_id', S.ws).order('updated_at', { ascending: false })
    : sb.from('inspections').select('*').eq('workspace_id', S.ws).order('created_at', { ascending: false }).limit(300);
  const { data, error } = await q; if (error) { toast('Could not load ' + col + ': ' + error.message); return; }
  if (col === 'products') S.products = data.map(prodFromRow); else S.inspections = data.map(inspFromRow);
  await signAll();
}
function rer() { if (['home', 'product', 'pick', 'insp', 'lot', 'slog'].includes(S.route.name)) render(); }
const FTOKEN = new URLSearchParams(location.search).get('f');
render();
(async () => {
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase) {
    S.setupMsg = 'Setup needed: put your Supabase project URL and anon key in config.js (see README).'; render(); return;
  }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, FTOKEN ? { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } } : undefined);
  if (FTOKEN) return startFactory(FTOKEN);
  sb.auth.onAuthStateChange((ev, session) => { if (session && !S.user) start(session); });
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session); else { S.ready = true; S.route = { name: 'login' }; render(); }
})();
})();
</script>
</body></html>
