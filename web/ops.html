<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orders, Defect Check</title>
<meta name="theme-color" content="#17222B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--paper:#EDF0F0;--panel:#FFFFFF;--sunk:#E4E9EA;--ink:#17222B;--muted:#5B6870;--line:#DCE2E4;--line2:#C7D0D4;--harbor:#1F5F7A;--harbor-bg:#E1EEF3;--hivis:#F3C33A;--pass:#16794F;--fail:#B4271C;--review:#3F4FB0;--warn:#9A6700;--pass-bg:#E3F2EA;--fail-bg:#FBE7E4;--review-bg:#E8EAF8;--warn-bg:#FBF0D9;--focus:#2457C5;--stencil:"Big Shoulders Stencil Display","Archivo",Impact,"Arial Narrow",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121A20;--panel:#1A242C;--sunk:#162027;--ink:#E6ECEF;--muted:#97A4AD;--line:#2A363E;--line2:#3A4751;--harbor:#6FB3D2;--harbor-bg:#17323F;--hivis:#F3C33A;--pass:#43BE8D;--fail:#F2695A;--review:#8E97F2;--warn:#E4AE35;--pass-bg:#1D3A2F;--fail-bg:#40211E;--review-bg:#262B4D;--warn-bg:#3A2F15;--focus:#7AA7FF;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121A20;--panel:#1A242C;--sunk:#162027;--ink:#E6ECEF;--muted:#97A4AD;--line:#2A363E;--line2:#3A4751;--harbor:#6FB3D2;--harbor-bg:#17323F;--hivis:#F3C33A;--pass:#43BE8D;--fail:#F2695A;--review:#8E97F2;--warn:#E4AE35;--pass-bg:#1D3A2F;--fail-bg:#40211E;--review-bg:#262B4D;--warn-bg:#3A2F15;--focus:#7AA7FF;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--harbor)}
.shell{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.brand{font-weight:800;font-stretch:118%;font-size:17px;padding:4px 10px 18px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:2px;background:var(--hivis);box-shadow:0 0 0 2px var(--ink)}
.rail a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);padding:9px 10px;border-radius:8px;font-weight:600}
.rail a:hover{background:var(--sunk)}
.rail a[aria-current="page"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--harbor)}
.rail a small{font-weight:700;color:var(--fail);font-size:12px}
.rail .grow{flex:1}
.rail .meta{font-size:12.5px;color:var(--muted);padding:0 10px}
main{padding:28px 32px 80px;max-width:1240px;width:100%}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{margin:0;font-size:26px;font-weight:800;font-stretch:112%;letter-spacing:-.01em;flex:1;min-width:220px}
.head p{margin:2px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;color:var(--ink);min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.blue{background:var(--harbor);color:#fff;border-color:var(--harbor)}
.btn.small{padding:5px 10px;min-height:32px;font-size:13.5px}
.btn.danger{color:var(--fail)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.sec{margin-top:26px}
.sec>h2{font-size:17px;font-weight:800;font-stretch:108%;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.sec>h2 span{font-size:13.5px;font-weight:500;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{font-weight:600;color:var(--muted);font-size:13px;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.tablewrap{overflow-x:auto}
.po{font-family:var(--stencil);font-weight:800;font-size:22px;letter-spacing:.02em;line-height:1}
.po.big{font-size:56px}
.mut{color:var(--muted)}
.sm{font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-PASS{background:var(--pass-bg);color:var(--pass)}.b-FAIL{background:var(--fail-bg);color:var(--fail)}.b-REVIEW{background:var(--review-bg);color:var(--review)}.b-WAIT{background:var(--sunk);color:var(--muted)}.b-WARN{background:var(--warn-bg);color:var(--warn)}
.route{display:grid;grid-template-columns:repeat(5,1fr);position:relative;min-width:240px}
.route::before{content:"";position:absolute;left:6px;right:6px;top:5px;height:2px;background:var(--line2)}
.route .fill{position:absolute;left:6px;top:5px;height:2px;background:var(--ink)}
.route .stop{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.route .stop:last-child{align-items:flex-end}
.route .dot{width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--line2);position:relative;z-index:1}
.route .stop.done .dot{background:var(--ink);border-color:var(--ink)}
.route .stop.now .dot{background:var(--hivis);border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--hivis) 35%,transparent)}
.route .stop.bad .dot{background:var(--fail);border-color:var(--fail)}
.route .lab{font-size:12px;color:var(--muted);white-space:nowrap}
.route.compact .lab{display:none}
.route.big{grid-template-columns:repeat(5,1fr);margin:26px 0 8px}
.route.big::before,.route.big .fill{top:8px;height:3px}
.route.big .dot{width:18px;height:18px}
.route.big .lab{font-size:14px;color:var(--ink);font-weight:700}
.route.big .when{font-size:12.5px;color:var(--muted);font-weight:500}
.hero{padding:22px 24px}
.hero .top{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.hero .id{flex:1;min-width:240px}
.hero .facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:14px}
.hero .facts b{color:var(--ink);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.att{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.att div{padding:8px 12px;border-radius:8px;font-size:14px}
.att .FAIL{background:var(--fail-bg);color:var(--fail)}.att .REVIEW{background:var(--review-bg);color:var(--review)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{padding:16px 18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.ctn{font-family:var(--stencil);font-weight:800;font-size:34px;letter-spacing:.04em;line-height:1}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.ph{margin:0;position:relative;border-radius:8px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.ph i{position:absolute;border:2px solid var(--hivis);border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.issues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.issues li{padding:8px 12px;border-radius:8px;background:var(--sunk);font-size:14px;display:flex;gap:10px;align-items:baseline}
.issues li.FAIL{background:var(--fail-bg)}.issues li.REVIEW{background:var(--review-bg)}
.who{font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--panel);white-space:nowrap}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 18px;margin-top:10px;font-size:14px}
.checks span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--muted)}
.checks .pass::before{background:var(--pass)}.checks .fail::before{background:var(--fail)}.checks .unclear::before{background:var(--warn)}
.empty{padding:40px 24px;text-align:center}
.empty h3{margin:0 0 6px;font-size:18px}
.empty p{margin:0 auto 16px;color:var(--muted);max-width:52ch}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13.5px}
.i{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:9px 11px;min-height:40px;width:100%}
textarea.i{min-height:72px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.form .w2{grid-column:span 2}.form .w4{grid-column:1/-1}
.lines td{padding:8px 10px}
.lines .i{min-height:36px;padding:6px 9px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(150px,240px) 1fr 70px;gap:12px;align-items:center;font-size:14px}
.bar .t{display:flex;gap:8px;align-items:baseline;min-width:0}
.bar .t code{font-family:inherit;font-weight:800;font-stretch:112%;font-size:12.5px;background:var(--sunk);border-radius:4px;padding:1px 6px}
.bar .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:14px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.bar .track b{position:absolute;inset:0 auto 0 0;background:var(--harbor);border-radius:3px}
.bar .track b.crit{background:var(--fail)}
.bar .n{text-align:right;font-weight:700}
.bar .n small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat .panel{padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:800;font-stretch:108%}
.stat span{font-size:13px;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:14px}
.step{padding:16px 18px}
.step h3{margin:0 0 10px;font-size:16px;display:flex;gap:10px;align-items:baseline}
.step h3 em{font-style:normal;font-weight:800;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--panel);display:inline-grid;place-items:center;font-size:13px;flex:none}
.adds{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--sunk);width:36px;height:36px;font-weight:800;cursor:pointer}
.stepper input{width:70px;border:0;text-align:center;height:36px;background:var(--panel)}
.dmg{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr 120px 1fr auto;gap:10px;align-items:end;margin-top:10px}
.dmg .photos{grid-column:1/-1}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs .ph{width:84px;aspect-ratio:1}
.thumbs .x{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.on{opacity:1}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:40;padding:20px;cursor:zoom-out}
.lb.on{display:flex}
.lb .wrap{position:relative;max-width:100%;max-height:100%}
.lb img{max-width:92vw;max-height:88vh;display:block}
.lb i{position:absolute;border:3px solid var(--hivis)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--harbor);border-radius:50%;animation:sp 0.9s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}#toast{transition:none}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);z-index:10}
  .brand{padding:0 8px 0 2px}
  .rail .grow,.rail .meta{display:none}
  .rail a{white-space:nowrap}
  main{padding:18px 14px 80px}
  .grid2,.stat{grid-template-columns:1fr 1fr}
  .form{grid-template-columns:1fr 1fr}
  .po.big{font-size:40px}
  .dmg{grid-template-columns:1fr 1fr}
  .bar{grid-template-columns:1fr 70px}.bar .track{grid-column:1/-1;grid-row:2}
}
@media (max-width:560px){.grid2,.stat,.form{grid-template-columns:1fr}.form .w2{grid-column:auto}.route.big .lab{font-size:12px}.route.big .when{display:none}}
</style></head><body>
<div class="shell">
  <nav class="rail" aria-label="Main">
    <div class="brand"><i aria-hidden="true"></i>Defect Check</div>
    <a href="#/orders" data-nav="orders">Orders <small id="navAtt"></small></a>
    <a href="#/defects" data-nav="defects">Defects</a>
    <a href="#/suppliers" data-nav="suppliers">Suppliers</a>
    <a href="index.html">Products</a>
    <div class="grow"></div>
    <div class="meta" id="sync">Connecting…</div>
  </nav>
  <main id="app"><p class="mut">Loading…</p></main>
</div>
<div id="toast" role="status"></div>
<div class="lb" id="lb"><div class="wrap"><img alt="Enlarged photo"></div></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="libIn" accept="image/*" multiple hidden>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
const CFG = window.DEFECT_CHECK_CONFIG || {};
let sb = null;
const S = { ws: null, products: [], pos: [], lines: [], links: [], sessions: [], loads: [], receipts: [], insps: [], findings: [], codes: [], filter: 'all', dfilter: { days: 90, stage: 'all', supplier: '' }, rx: null };
const URLS = new Map();
const STOPS = ['Ordered', 'In production', 'Inspected', 'Loaded', 'Received'];
const LOAD_STEP_NAMES = { empty: 'Empty container', number: 'Container number', half: 'Half loaded', full: 'Fully loaded', marks: 'Carton marks', sealed: 'Doors sealed', seal: 'Seal close-up' };
const ORIGIN = { factory: 'Factory', transit: 'Carrier', unclear: 'Unclear', loading: 'Factory', none: '' };

// ---------- small helpers ----------
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3200); }
const fmtDate = d => d ? new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
const fmtDT = d => d ? new Date(d).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
const n0 = v => (+v || 0).toLocaleString();
const badge = (r, label) => `<span class="badge b-${esc(r || 'WAIT')}">${esc(label || ({ PASS: 'Passed', FAIL: 'Failed', REVIEW: 'Needs review' }[r] || r || 'Waiting'))}</span>`;
const codeName = c => (S.codes.find(x => x.code === c) || {}).name_en || c;
const prodName = id => (S.products.find(p => p.id === id) || {}).name || 'Product';
const linesOf = po => S.lines.filter(l => l.po_id === po.id).sort((a, b) => a.seq - b.seq);
const sessionOf = l => S.sessions.find(s => s.link_id === l.link_id && s.status !== 'cancelled');
const loadingOf = po => S.loads.find(x => x.po_id === po.id && x.status !== 'cancelled');
const receiptOf = po => S.receipts.find(x => x.po_id === po.id);
const hubUrl = po => location.href.replace(/[#?].*$/, '').replace(/[^/]*$/, '') + 'po.html?t=' + po.token;
async function sign(paths) {
  const need = [...new Set(paths.filter(p => p && !URLS.has(p)))];
  for (let i = 0; i < need.length; i += 100) {
    const { data } = await sb.storage.from('photos').createSignedUrls(need.slice(i, i + 100), 60 * 60 * 6);
    (data || []).forEach(x => { if (x.signedUrl && x.path) URLS.set(x.path, x.signedUrl); });
  }
}
const url = p => URLS.get(p) || '';
function photoFig(path, caption, boxes = []) {
  const u = url(path);
  return `<figure class="ph" data-zoom="${esc(path)}" data-boxes='${esc(JSON.stringify(boxes))}'>${u ? `<img src="${esc(u)}" alt="${esc(caption || 'Photo')}" loading="lazy">` : ''}${boxes.map(b => `<i style="left:${b[0] * 100}%;top:${b[1] * 100}%;width:${b[2] * 100}%;height:${b[3] * 100}%"></i>`).join('')}${caption ? `<figcaption>${esc(caption)}</figcaption>` : ''}</figure>`;
}
async function prepImage(file) {
  let src; try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const k = Math.min(1, 1600 / Math.max(src.width, src.height)), c = document.createElement('canvas');
  c.width = Math.round(src.width * k); c.height = Math.round(src.height * k); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', .86));
}
function pickFiles(camera) {
  return new Promise(res => {
    const inp = camera ? $('#camIn') : $('#libIn'); inp.value = '';
    inp.onchange = () => res([...inp.files]); inp.click();
  });
}
async function callQc(body) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(CFG.supabaseUrl + '/functions/v1/qc', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.supabaseAnonKey, Authorization: 'Bearer ' + (session ? session.access_token : CFG.supabaseAnonKey) }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('Request failed (' + r.status + ')'));
  return j;
}

// ---------- PO status ----------
function poState(po) {
  const ls = linesOf(po), ses = ls.map(sessionOf), lc = loadingOf(po), rc = receiptOf(po);
  let stage = 0; const bad = new Set();
  if (ses.some(Boolean)) stage = 1;
  if (ls.length && ses.every(s => s && s.status === 'done')) stage = 2;
  if (lc && lc.status === 'done') stage = 3;
  if (rc && rc.status === 'done') stage = 4;
  const att = [];
  ls.forEach((l, k) => { const s = ses[k]; if (s && s.status === 'done' && s.result !== 'PASS' && !s.buyer_decision) { att.push({ level: s.result, text: `${prodName(l.product_id)}: factory lot ${s.result === 'FAIL' ? 'failed' : 'needs review'}` }); bad.add(2); } });
  if (lc && lc.status === 'done' && lc.result !== 'PASS') { att.push({ level: lc.result, text: `Container loading ${lc.result === 'FAIL' ? 'failed' : 'needs review'}` }); bad.add(3); }
  if (lc && lc.status === 'error') att.push({ level: 'REVIEW', text: 'Loading check could not run: ' + (lc.error || '') });
  if (rc && rc.status === 'done' && rc.result !== 'PASS') { att.push({ level: rc.result, text: `Receiving: ${(rc.ai && rc.ai.summary) || 'exceptions found'}` }); bad.add(4); }
  if (rc && rc.status === 'error') att.push({ level: 'REVIEW', text: 'Receiving check could not run: ' + (rc.error || '') });
  return { stage, att, bad, ls, ses, lc, rc };
}
function routeHtml(po, big) {
  const st = poState(po);
  const when = [po.created_at, (st.ses.find(Boolean) || {}).created_at, st.stage >= 2 ? Math.max(0, ...st.ses.filter(Boolean).map(s => new Date(s.finished_at || 0).getTime())) : null, st.lc && st.lc.checked_at, st.rc && st.rc.checked_at];
  const pct = st.stage / 4 * 100;
  return `<div class="route ${big ? 'big' : 'compact'}" role="img" aria-label="Stage: ${STOPS[st.stage]}"><div class="fill" style="width:calc(${pct}% - ${pct ? 12 : 0}px)"></div>${STOPS.map((s, k) => {
    const cls = st.bad.has(k) ? 'bad' : k < st.stage || (k === 4 && st.stage === 4) ? 'done' : k === st.stage ? 'now' : '';
    return `<div class="stop ${cls}"><span class="dot"></span><span class="lab">${esc(s)}${big && when[k] && k <= st.stage ? `<br><span class="when">${esc(fmtDate(when[k]))}</span>` : ''}</span></div>`;
  }).join('')}</div>`;
}

async function createPo() {
  const d = S.newPo;
  const po_number = d.po_number.trim();
  if (!po_number) return toast('Enter a PO number.');
  if (S.pos.some(p => p.po_number.toLowerCase() === po_number.toLowerCase())) return toast('That PO number already exists.');
  const lines = d.lines.filter(l => l.product_id);
  if (!lines.length) return toast('Add at least one product.');
  if (new Set(lines.map(l => l.product_id)).size !== lines.length) return toast('Each product can appear once per order.');
  for (const l of lines) {
    const q = Math.floor(+l.qty), u = Math.floor(+l.upc), c = Math.floor(+l.cartons);
    if (!(q > 0 && u > 0 && c > 0)) return toast(`Fill in units, units per carton and cartons for ${prodName(l.product_id)}.`);
    if (q > c * u || q <= (c - 1) * u) return toast(`${prodName(l.product_id)}: ${c} cartons of ${u} can't hold ${q} units.`);
  }
  const btn = document.querySelector('[data-a="createPo"]'); btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const { data: po, error } = await sb.from('purchase_orders').insert({ workspace_id: S.ws, po_number, supplier_name: d.supplier_name.trim() || null, supplier_city: d.supplier_city.trim() || null, ship_by: d.ship_by || null, eta: d.eta || null, notes: d.notes.trim() || null }).select().single();
    if (error) throw error;
    for (const [k, l] of lines.entries()) {
      const { data: link, error: e1 } = await sb.from('factory_links').insert({ workspace_id: S.ws, product_id: l.product_id, lot: po_number, factory_name: d.supplier_name.trim() || null }).select().single();
      if (e1) throw e1;
      const { error: e2 } = await sb.from('po_lines').insert({ po_id: po.id, workspace_id: S.ws, seq: k + 1, product_id: l.product_id, qty: Math.floor(+l.qty), cartons: Math.floor(+l.cartons), units_per_carton: Math.floor(+l.upc), link_id: link.id });
      if (e2) throw e2;
    }
    S.newPo = null; await reloadAll(); location.hash = '#/po/' + po.id; toast('Order created. Send the factory its link.');
  } catch (e) { toast('Could not create the order: ' + (e.message || e)); btn.disabled = false; btn.textContent = 'Create order and factory link'; }
}

function claimText(po) {
  const rc = receiptOf(po), lc = loadingOf(po), ai = (rc && rc.ai) || {};
  const L = [`Receiving report: PO ${po.po_number}${po.supplier_name ? ', supplier ' + po.supplier_name : ''}`, `Container ${rc.container_no || (lc && lc.container_no) || 'unknown'}, received ${fmtDT(rc.checked_at)}.`];
  const seal = ai.seal || {};
  L.push(`Seal at dock: ${seal.dock || 'not recorded'}${seal.loading ? `; seal at loading: ${seal.loading}` : ''}; condition: ${rc.seal_intact === false ? 'broken or tampered' : rc.seal_intact ? 'intact' : 'not shown'}.`);
  const part = (who, title) => { const xs = (ai.issues || []).filter(x => x.origin === who); if (!xs.length) return; L.push('', title); xs.forEach(x => L.push('- ' + x.text)); };
  part('factory', `For the supplier (${po.supplier_name || 'factory'}):`);
  part('transit', 'For the freight carrier:');
  part('unclear', 'Origin not determined:');
  if (!(ai.issues || []).length) L.push('', 'No exceptions: all cartons received in good condition.');
  if (lc && lc.status === 'done') L.push('', `Loading record: ${lc.container_no}, seal ${lc.seal_no}, loaded ${fmtDT(lc.submitted_at)}, ${Object.values(lc.counts || {}).reduce((a, b) => a + b, 0)} cartons reported loaded.`);
  L.push('', 'Photos and timestamps are stored in Defect Check.');
  return L.join('\n');
}

// ---------- defects ----------
function paretoHtml(rows, limit = 12) {
  const by = new Map(); rows.forEach(r => { const o = by.get(r.code) || { code: r.code, n: 0, crit: 0 }; o.n++; if (r.severity === 'critical') o.crit++; by.set(r.code, o); });
  const list = [...by.values()].sort((a, b) => b.n - a.n), total = rows.length, max = list.length ? list[0].n : 1;
  let cum = 0;
  return `<div class="bars">${list.slice(0, limit).map(o => { cum += o.n; return `<div class="bar"><div class="t"><code>${esc(o.code)}</code><span>${esc(codeName(o.code))}</span></div><div class="track" title="${o.n} findings"><b class="${o.crit ? 'crit' : ''}" style="width:${o.n / max * 100}%"></b></div><div class="n">${o.n}<small>${Math.round(cum / total * 100)}% cum.</small></div></div>`; }).join('')}</div>`;
}

  const failed = units.filter(i => (i.final_result || i.verdict) === 'FAIL').length;

  const crit = rows.filter(r => r.severity === 'critical').length;

  ${suppliers.length ? `<select class="i" data-a="dSup" style="width:auto;min-height:32px;padding:4px 10px;border-radius:999px"><option value="">All suppliers</option>${suppliers.map(s => `<option ${s === F.supplier ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>` : ''}</div>
  <div class="stat"><div class="panel"><b>${rows.length}</b><span>Findings</span></div><div class="panel"><b>${crit}</b><span>Critical</span></div><div class="panel"><b>${units.length}</b><span>Units checked</span></div><div class="panel"><b>${units.length ? (failed / units.length * 100).toFixed(1) + '%' : '—'}</b><span>Units failed</span></div></div>

function suppliersView() {
  setNav('suppliers'); document.title = 'Suppliers · Defect Check';

    const pos = S.pos.filter(p => p.supplier_name === name), links = S.links.filter(l => l.factory_name === name).map(l => l.id);

    const fl = S.findings.filter(x => x.supplier === name && !x.in_spec);

      <td>${top.map(([c, n]) => `<span class="who" style="background:var(--sunk)">${esc(c)}</span> ${esc(codeName(c))} ×${n}`).join('<br>') || '<span class="mut">None</span>'}</td></tr>`;
  };

  : `<div class="panel empty"><h3>No suppliers yet</h3><p>Suppliers appear here once you create an order with a supplier name.</p><a class="btn primary" href="#/new">New purchase order</a></div>`}`;
}

  }
  if (a === 'step' && S.rx) { const c = S.rx.counts[b.dataset.l] = S.rx.counts[b.dataset.l] || {}; c[b.dataset.k] = Math.max(0, (+c[b.dataset.k] || 0) + +b.dataset.d); const inp = app.querySelector(`[data-cnt="${b.dataset.l}"][data-k="${b.dataset.k}"]`); if (inp) inp.value = c[b.dataset.k]; saveRx(); }
  if (a === 'rxPhoto') { const files = await pickFiles(!!b.dataset.cam); if (files.length) { b.disabled = true; b.textContent = 'Uploading…'; await addPhotos(files, b.dataset.step, p => S.rx.photos.push({ ...p, step: b.dataset.step })); } }
  if (a === 'rmRxPhoto') { S.rx.photos = S.rx.photos.filter(p => p.path !== b.dataset.p); saveRx(true); render(); }
  if (a === 'addDmg') { const ls = linesOf(S.pos.find(p => p.id === S.rx.po)); S.rx.damage.push({ id: crypto.randomUUID(), line_id: ls[0] ? ls[0].id : '', carton: '', note: '', photos: [] }); saveRx(true); render(); }
  if (a === 'rmDmg') { S.rx.damage.splice(+k, 1); saveRx(true); render(); }
  if (a === 'dmgPhoto') { const files = await pickFiles(!!b.dataset.cam); if (files.length) { b.disabled = true; b.textContent = 'Uploading…'; const d = S.rx.damage[+k]; await addPhotos(files, 'damage', p => (d.photos = d.photos || []).push(p)); } }
  if (a === 'rmDmgPhoto') { const d = S.rx.damage[+k]; d.photos = d.photos.filter(p => p.path !== b.dataset.p); saveRx(true); render(); }
  if (a === 'runRx') { b.disabled = true; b.textContent = 'Starting…'; await runRx(); b.disabled = false; b.textContent = 'Run receiving check'; }
});
$('#lb').addEventListener('click', () => $('#lb').classList.remove('on'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lb').classList.remove('on'); });

// ---------- data ----------
async function reloadAll() {
  const ws = S.ws;
  const q = (t, sel = '*', order = 'created_at', asc = false, lim = 1000) => sb.from(t).select(sel).eq('workspace_id', ws).order(order, { ascending: asc }).limit(lim);
  const [pr, po, ln, lk, se, lc, rc, ins, fd] = await Promise.all([
    q('products', 'id, name, sku', 'updated_at'), q('purchase_orders'), q('po_lines', '*', 'seq', true), q('factory_links', 'id, product_id, lot, factory_name, active'), q('factory_sessions'),
    q('loading_checks', '*', 'started_at'), q('receipts'), q('inspections', 'id, product_id, factory_link_id, session_id, stage, status, verdict, final_result, created_at', 'created_at', false, 3000),
    q('defect_findings', '*', 'created_at', false, 5000)]);
  const err = [pr, po, ln, lk, se, lc, rc, ins, fd].find(r => r.error);
  if (err) toast('Could not load everything: ' + err.error.message);
  S.products = pr.data || []; S.pos = po.data || []; S.lines = ln.data || []; S.links = lk.data || []; S.sessions = se.data || [];
  S.loads = lc.data || []; S.receipts = rc.data || []; S.insps = ins.data || []; S.findings = fd.data || [];
  const att = S.pos.filter(p => !p.closed && poState(p).att.length).length; $('#navAtt').textContent = att ? att : '';
}
let rt = null;
function live() { clearTimeout(rt); rt = setTimeout(async () => { await reloadAll(); const h = location.hash; if (!/\/receive$/.test(h) && h !== '#/new') render(); }, 400); }
(async () => {
  if (!CFG.supabaseUrl || !window.supabase) { app.innerHTML = '<p>Setup needed: add your Supabase URL and anon key to config.js.</p>'; return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  let { data: { session } } = await sb.auth.getSession();
  if (!session) { const { data, error } = await sb.auth.signInAnonymously(); if (error) { app.innerHTML = `<p>Could not open your workspace: ${esc(error.message)}</p>`; return; } session = data.session; }
  const { data: m } = await sb.from('workspace_members').select('workspace_id, workspaces(name)').eq('user_id', session.user.id).order('created_at').limit(1);
  if (!m || !m.length) { app.innerHTML = '<p>No workspace found for this account.</p>'; return; }
  S.ws = m[0].workspace_id;
  const { data: codes } = await sb.from('defect_codes').select('*').order('sort'); S.codes = codes || [];
  await reloadAll();
  const ch = sb.channel('ops-' + S.ws);
  ['purchase_orders', 'po_lines', 'loading_checks', 'receipts', 'factory_sessions', 'inspections', 'products', 'factory_links'].forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t, filter: 'workspace_id=eq.' + S.ws }, live));
  ch.subscribe(st => { $('#sync').textContent = st === 'SUBSCRIBED' ? 'Live' : 'Reconnecting…'; });
  render();
})();
})();
</script>
